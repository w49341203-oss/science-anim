<title>國中理化動起來</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b0f19;--panel:#121828;--panel2:#171f33;--line:#2a3247;--text:#f3f4f6;--dim:#9aa3b8;--blue:#58C4DD;--teal:#5CD0B3;--green:#83C167;--yellow:#FFFF00;--gold:#F0AC5F;--red:#FC6255;--purple:#9A72AC;color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.6;margin:0}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:20;background:#0b0f19ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
.top h1 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}
.menubtn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px}
.booktabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.booktabs a{text-decoration:none;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}
.booktabs a.on{color:var(--bg);background:var(--blue);border-color:var(--blue)}
.layout{display:flex;min-height:100vh}
nav.side{width:280px;flex:none;border-right:1px solid var(--line);padding:16px 12px 40px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;background:var(--bg)}
nav.side .bk{font-weight:700;color:var(--gold);margin:14px 6px 4px;font-size:14px}
nav.side .ch{display:block;color:var(--text);text-decoration:none;padding:5px 8px;border-radius:6px;font-size:14px}
nav.side .ch:hover{background:var(--panel)}
nav.side .ch.on{background:var(--panel2);color:var(--blue)}
nav.side .sec{display:block;color:var(--dim);text-decoration:none;padding:2px 8px 2px 22px;font-size:13px}
nav.side .sec:hover{color:var(--text)}
main{flex:1;min-width:0;padding:20px clamp(16px,3vw,40px) 80px}
.intro{background:linear-gradient(135deg,#131b33,#0f1526);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:28px}
.intro h2{margin:0 0 6px;font-size:22px}
.intro p{margin:6px 0;color:var(--dim)}
.intro .how{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.intro .how div{flex:1 1 220px;background:#0b0f19aa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.book{margin-top:36px}
.book>h2{font-size:26px;margin:0 0 4px;color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:6px}
.book>.bnote{color:var(--dim);font-size:13px;margin-bottom:14px}
.chapter{margin-top:34px;scroll-margin-top:70px}
.chapter>h3{font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.chapter>h3 .num{background:var(--blue);color:var(--bg);border-radius:8px;padding:0 10px;font-size:15px;line-height:26px}
.section{margin-top:22px;scroll-margin-top:70px}
.section>h4{font-size:17px;color:var(--teal);margin:0 0 10px;padding-left:10px;border-left:3px solid var(--teal)}
.point{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0 18px}
.point h5{margin:0 0 4px;font-size:17px;display:flex;gap:8px;align-items:baseline}
.point h5 .idx{color:var(--dim);font-size:13px;font-weight:400}
.point .key{margin:0 0 12px;color:#dfe4f0;background:#0b0f1966;border-left:3px solid var(--yellow);padding:6px 10px;border-radius:0 8px 8px 0;font-size:14.5px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.mod{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;min-width:0}
.modhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:700;letter-spacing:.5px}
.badge.sim{background:#1f4d57;color:var(--blue)}
.badge.anim{background:#4a2f55;color:#d7a6ea}
.modtitle{font-weight:700;font-size:15px}
.modnote{color:var(--dim);font-size:13px;margin-bottom:8px}
.cvbox{position:relative;width:100%;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.cvbox canvas{display:block;width:100%}
.playover{position:absolute;inset:0;background:#0b0f1966;border:0;color:#fff;font-size:44px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.playover span{width:78px;height:78px;border-radius:50%;background:var(--blue);color:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:6px;box-shadow:0 6px 30px #58C4DD66}
.playover[hidden]{display:none}
.ctrl{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.prow{display:grid;grid-template-columns:5.5em 1fr 6em;align-items:center;gap:8px;font-size:13.5px}
.prow input[type=range]{width:100%;accent-color:var(--blue);margin:0;min-width:0}
.prow.choice{grid-template-columns:5.5em 1fr;align-items:start}
.pgrp{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{background:#1e2740;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;line-height:1.5}
.pbtn:hover{border-color:var(--blue)}
.pbtn.on{background:var(--blue);color:var(--bg);border-color:var(--blue);font-weight:700}
.pval{color:var(--yellow);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{background:#1e2740;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.abar{display:flex;align-items:center;gap:8px;margin-top:8px}
.ab{background:#1e2740;border:1px solid var(--line);color:var(--text);border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:13px}
.ab.play{background:var(--blue);color:var(--bg);border-color:var(--blue);font-weight:700}
.prog{flex:1;height:6px;background:#1e2740;border-radius:3px;overflow:hidden}
.progfill{height:100%;background:var(--blue);width:0}
.stepno{color:var(--dim);font-size:12px;min-width:3em;text-align:right}
.caption{margin-top:8px;min-height:2.6em;background:#0b0f19;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;color:#e8ecf5}
details.think{margin-top:12px;background:#0b0f1966;border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
details.think summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:14px}
details.think .q{margin:6px 0 4px}
details.think .a{color:var(--green);border-top:1px solid var(--line);padding-top:6px;margin-top:6px;font-size:14px}
.missing{padding:30px;color:var(--red);text-align:center}
.footer{margin-top:60px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:820px){
  .menubtn{display:block}
  nav.side{position:fixed;left:0;top:53px;height:calc(100vh - 53px);transform:translateX(-100%);transition:transform .2s;z-index:30;width:min(300px,85vw);box-shadow:0 0 40px #000a}
  nav.side.open{transform:none}
  .booktabs{display:none}
  main{padding:14px 16px 60px}
  .prow{grid-template-columns:4.5em 1fr 5em}
  .prow.choice{grid-template-columns:4.5em 1fr}
}
</style>
<div class="top"><button class="menubtn">☰ 目錄</button><h1>國中理化動起來<small>操作模擬 × 播放動畫</small></h1><div class="booktabs"></div></div>
<div class="layout">
<nav class="side"></nav>
<main>
<div class="intro">
  <h2>先看會動的，再看公式</h2>
  <p>依課本章節排列，每個核心重點都有可以自己動手拉的<b style="color:var(--blue)">操作模擬</b>，或按播放鍵一步一步看的<b style="color:#d7a6ea">播放動畫</b>。共 <span id="modcount">–</span> 個模組。</p>
  <div class="how">
    <div>🎚 <b>操作模擬</b>：拖動滑桿改變數值，畫面上的數字會跟著變，看「改了什麼、結果怎麼變」。</div>
    <div>▶ <b>播放動畫</b>：按 ▶ 播放，用 ⏮ ⏭ 一步一步看，每一步下方有一句話說明。</div>
    <div>💭 <b>想一想</b>：每個重點後面有一題，先想過再點開答案。</div>
  </div>
</div>
</main>
</div>
<div class="footer">章節順序依麻辣講義（八上、九上）與 108 課綱（八下、九下）。動畫手法參考 3Blue1Brown（manim）。</div>
<script>
/* ---- engine.js ---- */
/* ===== 3b1b-style Canvas engine ===== */
const C = {
  bg:'#0b0f19', panel:'#121828', line:'#2a3247', dim:'#5b6478',
  blue:'#58C4DD', teal:'#5CD0B3', green:'#83C167', yellow:'#FFFF00', gold:'#F0AC5F',
  red:'#FC6255', purple:'#9A72AC', grey:'#999999', white:'#f3f4f6', orange:'#FF8C42', pink:'#FF6FB5'
};
const U = {
  ease:p=>p<0?0:p>1?1:p*p*(3-2*p),
  lerp:(a,b,p)=>a+(b-a)*p,
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  fmt:(n,d=1)=>(Math.round(n*10**d)/10**d).toFixed(d),
  circle(ctx,x,y,r,fill,stroke,lw=2){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}},
  line(ctx,x1,y1,x2,y2,color,lw=2,dash){ctx.save();if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();ctx.restore();},
  rect(ctx,x,y,w,h,fill,stroke,lw=2){if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}},
  arrow(ctx,x1,y1,x2,y2,color,lw=2.5,head=9){const a=Math.atan2(y2-y1,x2-x1);const L=Math.hypot(x2-x1,y2-y1);if(L<0.5)return;const hx=x2-head*Math.cos(a),hy=y2-head*Math.sin(a);ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(hx,hy);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-0.45),y2-head*Math.sin(a-0.45));ctx.lineTo(x2-head*Math.cos(a+0.45),y2-head*Math.sin(a+0.45));ctx.closePath();ctx.fill();ctx.restore();},
  text(ctx,s,x,y,color=C.white,size=14,align='left',weight=''){ctx.save();ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore();},
  glow(ctx,x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(0.35,color+'88');g.addColorStop(1,color+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();},
  grid(ctx,w,h,step=40){ctx.save();ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;for(let x=0;x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(let y=0;y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}ctx.restore();},
  // axes: origin at (x0,y0) bottom-left, width w, height h, returns mapping fns
  axes(ctx,x0,y0,w,h,o={}){U.arrow(ctx,x0,y0,x0+w,y0,C.grey,1.5,7);U.arrow(ctx,x0,y0,x0,y0-h,C.grey,1.5,7);if(o.xl)U.text(ctx,o.xl,x0+w+4,y0+2,C.grey,13,'left');if(o.yl)U.text(ctx,o.yl,x0,y0-h-12,C.grey,13,'center');const xm=o.xmax||1,ym=o.ymax||1;return{x:v=>x0+v/xm*w,y:v=>y0-v/ym*h,x0,y0,w,h};},
  plot(ctx,m,pts,color,lw=2.5){if(pts.length<2)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>{const X=m.x(p[0]),Y=m.y(p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.stroke();ctx.restore();},
  poly(ctx,pts,fill,stroke,lw=2){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}},
  label(ctx,s,x,y,color=C.white,size=13){ctx.save();ctx.font=`${size}px "Noto Sans TC",system-ui,sans-serif`;const tw=ctx.measureText(s).width;ctx.fillStyle='#0b0f19cc';ctx.fillRect(x-tw/2-6,y-size*0.8,tw+12,size*1.6);ctx.restore();U.text(ctx,s,x,y,color,size,'center');},
  rnd:(a,b)=>a+Math.random()*(b-a),
  hsl:(h,s=80,l=60)=>`hsl(${h},${s}%,${l}%)`,
  tempColor(t,lo=0,hi=100){const p=U.clamp((t-lo)/(hi-lo),0,1);return `hsl(${U.lerp(220,0,p)},85%,${U.lerp(55,55,p)}%)`;}
};

const Engine = (()=>{
  const defs={};
  const sim=(id,d)=>{defs[id]={type:'sim',id,...d};};
  const anim=(id,d)=>{defs[id]={type:'anim',id,...d};};
  function setupCanvas(box){
    const cv=document.createElement('canvas');cv.className='cv';box.appendChild(cv);
    const ctx=cv.getContext('2d');
    const fit=()=>{const r=box.getBoundingClientRect();const w=Math.max(200,Math.floor(r.width));const h=Math.floor(w*9/16);const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cv._w=w;cv._h=h;};
    fit();new ResizeObserver(fit).observe(box);
    return {cv,ctx};
  }
  function mount(id,host){
    const d=defs[id];if(!d){host.innerHTML='<div class="missing">（模組 '+id+' 尚未建立）</div>';return null;}
    const wrap=document.createElement('div');wrap.className='mod '+d.type;
    const head=document.createElement('div');head.className='modhead';head.innerHTML=`<span class="badge ${d.type}">${d.type==='sim'?'操作模擬':'播放動畫'}</span><span class="modtitle">${d.title}</span>`;wrap.appendChild(head);
    if(d.note){const n=document.createElement('div');n.className='modnote';n.textContent=d.note;wrap.appendChild(n);}
    const box=document.createElement('div');box.className='cvbox';wrap.appendChild(box);
    host.appendChild(wrap);
    const {cv,ctx}=setupCanvas(box);
    const inst={id,d,cv,ctx,running:false,visible:false};
    if(d.type==='sim')mountSim(inst,wrap,box);else mountAnim(inst,wrap,box);
    return inst;
  }
  function mountSim(inst,wrap,box){
    const d=inst.d;const s={};(d.params||[]).forEach(p=>s[p.key]=p.value);
    inst.s=s;let t=0;
    const ctrl=document.createElement('div');ctrl.className='ctrl';wrap.appendChild(ctrl);
    (d.params||[]).forEach(p=>{
      const row=document.createElement('label');row.className='prow';
      const val=document.createElement('span');val.className='pval';
      const upd=()=>{val.textContent=(p.fmt?p.fmt(s[p.key]):U.fmt(s[p.key],p.dec??(String(p.step||1).split('.')[1]||'').length))+(p.unit?' '+p.unit:'');};
      const st=p.step||1;const nOpt=Math.round((p.max-p.min)/st)+1;const isChoice=p.type==='choice'||(p.type!=='range'&&Number.isInteger(st)&&((p.fmt&&nOpt<=8)||nOpt<=6));
      if(isChoice){
        row.className='prow choice';row.innerHTML=`<span class="plabel">${p.label}</span>`;const grp=document.createElement('div');grp.className='pgrp';
        const btns=[];for(let k=0;k<nOpt;k++){const v=p.min+k*st;const b=document.createElement('button');b.type='button';b.className='pbtn';b.textContent=(p.fmt?p.fmt(v):String(v))+(p.fmt||!p.unit?'':' '+p.unit);b.dataset.v=v;b.onclick=()=>{s[p.key]=v;paint();if(d.onChange)d.onChange(s,p.key);};grp.appendChild(b);btns.push(b);}
        const paint=()=>btns.forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.v)===s[p.key]));
        row.appendChild(grp);ctrl.appendChild(row);paint();
        inst['_set_'+p.key]=v=>{s[p.key]=v;paint();};
        return;
      }
      const inp=document.createElement('input');inp.type='range';inp.min=p.min;inp.max=p.max;inp.step=st;inp.value=p.value;
      inp.oninput=()=>{s[p.key]=parseFloat(inp.value);upd();if(d.onChange)d.onChange(s,p.key);};
      row.innerHTML=`<span class="plabel">${p.label}</span>`;row.appendChild(inp);row.appendChild(val);ctrl.appendChild(row);upd();
      inst['_set_'+p.key]=v=>{inp.value=v;s[p.key]=v;upd();};
    });
    if(d.buttons){const br=document.createElement('div');br.className='brow';d.buttons.forEach(b=>{const bt=document.createElement('button');bt.className='btn';bt.textContent=b.label;bt.onclick=()=>{b.onClick(s,inst);};br.appendChild(bt);});ctrl.appendChild(br);}
    if(d.init)d.init(s,inst);
    inst.reset=()=>{if(d.init)d.init(s,inst);};
    const P=ev=>{const r=inst.cv.getBoundingClientRect();const src=ev.touches?ev.touches[0]||ev.changedTouches[0]:ev;return{x:src.clientX-r.left,y:src.clientY-r.top,w:inst.cv._w,h:inst.cv._h};};
    if(d.pointer){
      const cv=inst.cv;let down=false;
      const on=(type)=>ev=>{if(type==='down')down=true;if(type==='up')down=false;if(type==='move'&&!down&&!d.hover)return;const q=P(ev);d.pointer(s,{type,...q,down},inst);if(ev.cancelable&&type!=='up')ev.preventDefault();};
      cv.addEventListener('pointerdown',on('down'));cv.addEventListener('pointermove',on('move'));window.addEventListener('pointerup',on('up'));cv.style.touchAction='none';
    }
    let last=null;
    inst.frame=(now)=>{const dt=last?Math.min(0.05,(now-last)/1000):0;last=now;t+=dt;if(d.step)d.step(s,dt,t,inst);const ctx=inst.ctx,w=inst.cv._w,h=inst.cv._h;ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);d.draw(ctx,w,h,s,t,inst);};
  }
  function mountAnim(inst,wrap,box){
    const d=inst.d;const steps=d.steps;const total=steps.reduce((a,s)=>a+s.dur,0);
    let time=0,playing=false,last=null;
    const overlay=document.createElement('button');overlay.className='playover';overlay.innerHTML='<span>▶</span>';box.appendChild(overlay);
    const bar=document.createElement('div');bar.className='abar';
    bar.innerHTML=`<button class="ab prev" title="上一步">⏮</button><button class="ab play" title="播放/暫停">▶</button><button class="ab next" title="下一步">⏭</button><div class="prog"><div class="progfill"></div></div><span class="stepno"></span>`;
    wrap.appendChild(bar);
    const cap=document.createElement('div');cap.className='caption';wrap.appendChild(cap);
    const fill=bar.querySelector('.progfill'),playBtn=bar.querySelector('.play'),stepno=bar.querySelector('.stepno');
    const locate=()=>{let acc=0;for(let i=0;i<steps.length;i++){if(time<acc+steps[i].dur||i===steps.length-1){const p=U.clamp((time-acc)/steps[i].dur,0,1);return{i,p};}acc+=steps[i].dur;}return{i:steps.length-1,p:1};};
    const startOf=i=>steps.slice(0,i).reduce((a,s)=>a+s.dur,0);
    const render=()=>{const {i,p}=locate();const ctx=inst.ctx,w=inst.cv._w,h=inst.cv._h;ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);d.draw(ctx,w,h,i,U.ease(p),time);cap.textContent=steps[i].caption;stepno.textContent=(i+1)+'/'+steps.length;fill.style.width=(time/total*100)+'%';};
    const setPlaying=v=>{playing=v;playBtn.textContent=v?'⏸':'▶';overlay.hidden=v||time>0;last=null;};
    overlay.onclick=()=>{if(time>=total)time=0;setPlaying(true);};
    playBtn.onclick=()=>{if(time>=total)time=0;setPlaying(!playing);};
    bar.querySelector('.prev').onclick=()=>{const {i,p}=locate();time=startOf(p>0.15?i:Math.max(0,i-1));setPlaying(false);render();};
    bar.querySelector('.next').onclick=()=>{const {i}=locate();time=i<steps.length-1?startOf(i+1):total;setPlaying(false);render();};
    inst.cv.onclick=()=>{if(time>=total)time=0;setPlaying(!playing);};
    inst.frame=(now)=>{if(playing){const dt=last?Math.min(0.05,(now-last)/1000):0;last=now;time+=dt;if(time>=total){time=total;setPlaying(false);overlay.hidden=false;overlay.innerHTML='<span>↻</span>';}}render();};
    render();
  }
  // run loop only for visible instances
  const live=new Set();
  function loop(now){live.forEach(i=>{try{i.frame(now);}catch(e){if(!i._err){console.error('module '+i.id,e);i._err=true;}}});requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  const io=new IntersectionObserver(es=>{es.forEach(e=>{const i=e.target._inst;if(!i)return;if(e.isIntersecting)live.add(i);else live.delete(i);});},{rootMargin:'100px'});
  function watch(inst){inst.cv.parentElement._inst=inst;io.observe(inst.cv.parentElement);}
  return {sim,anim,mount,watch,defs};
})();

   U.text(ctx,p>=1?'溶完了！':'溶解中…'+U.fmt(p*100,0)+'%',c.x,y+ch/2,p>=1?C.green:C.white,15,'center','700');

Engine.sim('8a_floatsink',{title:'密度決定浮或沉',note:'調物體與液體的密度，物體會自己找到位置：比液體輕就浮，比液體重就沉。',
 params:[{key:'do',label:'物體密度',min:0.2,max:2,step:0.05,value:0.8,unit:'g/cm³'},{key:'dl',label:'液體密度',min:0.5,max:1.5,step:0.05,value:1,unit:'g/cm³'}],
 init:s=>{s.y=0;s.vy=0;},
 step:(s,dt)=>{const target=s.do<s.dl?-(1-s.do/s.dl):s.do>s.dl?1:0;s.vy+=(target*1.0-s.y)*8*dt-s.vy*4*dt;s.y+=s.vy*dt*4;},
 draw:(ctx,w,h,s)=>{
  const bx=w*0.3,bw=w*0.4,by=h*0.12,bh=h*0.78;const surf=by+bh*0.25;
  ctx.fillStyle=U.tempColor(s.dl*50,0,100)+'';ctx.globalAlpha=0.35;ctx.fillRect(bx,surf,bw,by+bh-surf);ctx.globalAlpha=1;
  ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by);ctx.stroke();
  const sz=60;const top=surf-sz,bottom=by+bh-sz;
  let y;if(s.do<s.dl){const frac=s.do/s.dl;y=surf-sz*(1-frac);}else if(s.do>s.dl)y=bottom;else y=(surf+bottom)/2-sz/2;
  // animate approach
  s.cur=s.cur===undefined?y:s.cur+(y-s.cur)*0.05;
  ctx.fillStyle=C.gold;ctx.fillRect(w/2-sz/2,s.cur,sz,sz);ctx.strokeStyle='#fff';ctx.strokeRect(w/2-sz/2,s.cur,sz,sz);
  const st=s.do<s.dl?'浮':s.do>s.dl?'沉':'懸浮';
  U.text(ctx,st,w/2,s.cur+sz/2,'#222',20,'center','700');
  U.text(ctx,'物體 '+U.fmt(s.do,2)+' g/cm³',bx-14,h*0.3,C.gold,14,'right');
  U.text(ctx,'液體 '+U.fmt(s.dl,2)+' g/cm³',bx+bw+14,surf+30,C.blue,14,'left');
  const rel=s.do<s.dl?'物體密度 < 液體密度 → 上浮':s.do>s.dl?'物體密度 > 液體密度 → 下沉':'密度相等 → 懸浮';
  U.text(ctx,rel,w/2,h*0.06,C.yellow,15,'center','700');
  if(s.do<s.dl)U.text(ctx,'沒入水中的比例 = '+U.fmt(s.do/s.dl*100,0)+'%',w/2,h*0.96,C.dim,12,'center');
 }});

Engine.sim('8a_states',{title:'三態的粒子模型',note:'拉溫度：粒子動得快慢、排得緊鬆會改變，物質從固體變液體再變氣體。粒子本身不變。',
 params:[{key:'T',label:'溫度',min:-20,max:140,step:1,value:20,unit:'°C'}],
 init:s=>{s.ps=[];for(let i=0;i<48;i++)s.ps.push({i,x:0,y:0,vx:U.rnd(-1,1),vy:U.rnd(-1,1),ph:U.rnd(0,6.28)});},
 step:(s,dt,t)=>{const T=s.T;const box={x:0.35,y:0.12,w:0.3,h:0.8};s.box=box;
  s.ps.forEach((p,i)=>{
   if(T<0){const col=i%8,row=Math.floor(i/8);const amp=0.004*(T+20)/20;p.tx=box.x+box.w*(0.12+col*0.11);p.ty=box.y+box.h*(0.35+row*0.1);p.x=p.tx+Math.sin(t*8+p.ph)*amp;p.y=p.ty+Math.cos(t*7+p.ph)*amp;}
   else if(T<100){const sp=0.05+T/100*0.1;p.x+=p.vx*sp*dt;p.y+=p.vy*sp*dt;if(p.x<box.x+0.02||p.x>box.x+box.w-0.02)p.vx*=-1;const floor=box.y+box.h,ceil=box.y+box.h*0.42;if(p.y>floor-0.02){p.y=floor-0.02;p.vy=-Math.abs(p.vy);}if(p.y<ceil){p.vy=Math.abs(p.vy);p.y=ceil;}p.vy+=0.2*dt;p.x=U.clamp(p.x,box.x+0.02,box.x+box.w-0.02);}
   else{const sp=0.25+(T-100)/40*0.2;p.x+=p.vx*sp*dt;p.y+=p.vy*sp*dt;if(p.x<box.x+0.02||p.x>box.x+box.w-0.02)p.vx*=-1;if(p.y<box.y+0.02||p.y>box.y+box.h-0.02)p.vy*=-1;p.x=U.clamp(p.x,box.x+0.02,box.x+box.w-0.02);p.y=U.clamp(p.y,box.y+0.02,box.y+box.h-0.02);}
  });},
 draw:(ctx,w,h,s)=>{
  const b=s.box;ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.strokeRect(b.x*w,b.y*h,b.w*w,b.h*h);
  const col=s.T<0?C.blue:s.T<100?C.teal:C.red;
  s.ps.forEach(p=>U.circle(ctx,p.x*w,p.y*h,7,col));
  const st=s.T<0?'固體':s.T<100?'液體':'氣體';
  U.text(ctx,st,w/2,h*0.06,col,20,'center','700');
  const desc=s.T<0?['粒子排列整齊','只在原地振動','有固定形狀與體積']:s.T<100?['粒子靠得近但能滑動','沒有固定形狀','體積固定']:['粒子距離很遠','到處亂飛','充滿整個容器'];
  desc.forEach((d,k)=>U.text(ctx,'• '+d,w*0.7,h*0.35+k*24,C.white,14));
  U.text(ctx,'溫度越高 → 粒子動得越快',w*0.7,h*0.75,C.yellow,13);
  // thermometer
  const tx=w*0.15,ty=h*0.15,th=h*0.7;U.rect(ctx,tx-6,ty,12,th,'#222',C.grey,1);const f=(s.T+20)/160;ctx.fillStyle=U.tempColor(s.T,-20,140);ctx.fillRect(tx-4,ty+th*(1-f),8,th*f);U.circle(ctx,tx,ty+th+6,12,U.tempColor(s.T,-20,140));
  U.text(ctx,s.T+'°C',tx,ty-16,C.white,13,'center');
 }});

Engine.anim('8a_change',{title:'物理變化 vs 化學變化',note:'同樣都是「變了」，關鍵看有沒有產生新物質。',
 steps:[{caption:'冰塊融化成水：狀態改變，粒子還是 H₂O——物理變化',dur:3},{caption:'紙撕成兩半：形狀改變，還是紙——物理變化',dur:2.5},{caption:'木炭燃燒：碳和氧結合，變成二氧化碳——產生新物質，化學變化',dur:3.5},{caption:'鐵生鏽：鐵和氧、水反應變成鐵鏽——化學變化',dur:3},{caption:'判斷關鍵：有沒有新物質。化學變化常伴隨發光、發熱、變色、產生氣體或沉澱',dur:3}],
 draw:(ctx,w,h,i,p)=>{

Engine.sim('8a_conc',{title:'重量百分濃度',note:'加糖或加水，看濃度怎麼算。記住：分母是「整杯溶液」，不是水。',

Engine.sim('8a_solubility',{title:'溶解度曲線：飽和了嗎？',note:'拉溫度和加入的硝酸鉀，看點落在曲線哪一邊：線上是飽和，線下未飽和，線上方多出來的會析出。',
 params:[{key:'T',label:'溫度',min:0,max:100,step:1,value:40,unit:'°C'},{key:'m',label:'加入溶質',min:0,max:250,step:5,value:60,unit:'g /100g水'}],
 draw:(ctx,w,h,s)=>{
  const sol=T=>13+0.0045*T*T+0.65*T; // approx KNO3
  const ax=U.axes(ctx,w*0.1,h*0.85,w*0.5,h*0.7,{xl:'溫度(°C)',yl:'溶解度 (g/100g水)',xmax:100,ymax:260});

  for(let g=0;g<=250;g+=50)U.text(ctx,String(g),ax.x0-6,ax.y(g),C.grey,11,'right');
  const pts=[];for(let t=0;t<=100;t+=2)pts.push([t,sol(t)]);U.plot(ctx,ax,pts,C.teal);
  U.text(ctx,'硝酸鉀',ax.x(80)+10,ax.y(sol(80))-10,C.teal,12);
  const S=sol(s.T);const sat=s.m>=S;const ex=Math.max(0,s.m-S);
  U.glow(ctx,ax.x(s.T),ax.y(Math.min(s.m,260)),16,sat?C.red:C.blue);U.circle(ctx,ax.x(s.T),ax.y(Math.min(s.m,260)),6,C.white);
  U.line(ctx,ax.x(s.T),ax.y0,ax.x(s.T),ax.y(S),C.dim,1,[3,3]);
  // beaker
  const bx=w*0.72,bw=w*0.2,by=h*0.2,bh=h*0.55;ctx.fillStyle='#5CD0B344';ctx.fillRect(bx,by+bh*0.3,bw,bh*0.7);ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by);ctx.stroke();
  if(ex>0){const n=Math.min(40,Math.round(ex/4));ctx.fillStyle=C.white;for(let k=0;k<n;k++){const px=bx+8+((k*37)%(bw-16)),py=by+bh-6-Math.floor(k/8)*7;ctx.fillRect(px,py,5,5);}}
  U.text(ctx,s.T+'°C 溶解度 '+U.fmt(S,0)+' g',bx+bw/2,by-14,C.teal,13,'center');
  const st=ex>0?'飽和，析出 '+U.fmt(ex,0)+' g':sat?'剛好飽和':'未飽和，還能再溶 '+U.fmt(S-s.m,0)+' g';
  U.text(ctx,st,bx+bw/2,by+bh+22,ex>0?C.red:sat?C.yellow:C.blue,13,'center','700');
 }});

Engine.anim('8a_wavetype',{title:'橫波與縱波',note:'看紅色那一顆粒子：它只在原地振動，往前跑的是「波形」。',
 steps:[{caption:'橫波：抖動繩子，繩上每一點上下振動，波往右前進——振動方向與前進方向垂直',dur:4},{caption:'注意紅點：它只在原地上下動，並沒有跟著波往右跑',dur:3},{caption:'縱波：推拉彈簧，圈圈前後振動，形成密部（擠在一起）與疏部（拉開）',dur:4},{caption:'縱波的振動方向與前進方向平行；聲波就是縱波',dur:3},{caption:'兩種波都只把「能量」往前傳，介質本身留在原地',dur:3}],
 draw:(ctx,w,h,i,p,t)=>{
  const y1=h*0.28,y2=h*0.72;const k=2*Math.PI/(w*0.25);
  // transverse
  U.text(ctx,'橫波',w*0.05,y1-h*0.17,C.blue,15,'left','700');
  ctx.strokeStyle=C.blue;ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=w*0.05;x<=w*0.95;x+=3){const y=y1+Math.sin(k*x-t*4)*h*0.09;x===w*0.05?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
  const rx=w*0.45,ry=y1+Math.sin(k*rx-t*4)*h*0.09;U.glow(ctx,rx,ry,14,C.red);U.circle(ctx,rx,ry,6,C.red);
  if(i>=1){U.arrow(ctx,rx+30,y1-h*0.12,rx+30,y1+h*0.12,C.red,2,7);U.arrow(ctx,rx+30,y1+h*0.12,rx+30,y1-h*0.12,C.red,2,7);U.text(ctx,'振動方向',rx+40,y1,C.red,12);}
  U.arrow(ctx,w*0.72,y1-h*0.15,w*0.88,y1-h*0.15,C.yellow,2,8);U.text(ctx,'波前進方向',w*0.8,y1-h*0.15-14,C.yellow,12,'center');
  // longitudinal
  if(i>=2){U.text(ctx,'縱波',w*0.05,y2-h*0.15,C.teal,15,'left','700');
   const n=40;for(let j=0;j<n;j++){const x0=w*0.05+j*(w*0.9/n);const x=x0+Math.sin(k*x0-t*4)*12;const dense=Math.cos(k*x0-t*4);ctx.strokeStyle=dense>0.3?C.teal:'#5CD0B388';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y2,4,h*0.07,0,0,Math.PI*2);ctx.stroke();}
   const rx2=w*0.45;const x2=rx2+Math.sin(k*rx2-t*4)*12;U.circle(ctx,x2,y2,6,C.red);
   if(i>=3){U.arrow(ctx,x2-30,y2+h*0.11,x2+30,y2+h*0.11,C.red,2,7);U.arrow(ctx,x2+30,y2+h*0.11,x2-30,y2+h*0.11,C.red,2,7);U.text(ctx,'振動方向',x2+38,y2+h*0.11,C.red,12);}
   U.arrow(ctx,w*0.72,y2-h*0.13,w*0.88,y2-h*0.13,C.yellow,2,8);U.text(ctx,'波前進方向',w*0.8,y2-h*0.13-14,C.yellow,12,'center');
   // label dense/sparse
   for(let j=0;j<4;j++){const xd=(t*4/k+j*2*Math.PI/k)%(w*0.9)+w*0.05;if(xd<w*0.9)U.text(ctx,'密',xd,y2+h*0.13+(i>=3?12:0),C.teal,11,'center');}
  }
  if(i===4)U.text(ctx,'波傳遞能量，不傳遞介質',w/2,h*0.5,C.yellow,16,'center','700');
 }});

Engine.sim('8a_wave',{title:'波長、頻率、振幅：v = f × λ',note:'拉頻率看波長怎麼變（波速由繩子決定，固定不變）；拉振幅看能量大小。',
 params:[{key:'f',label:'頻率 f',min:0.5,max:4,step:0.1,value:2,unit:'Hz'},{key:'A',label:'振幅 A',min:0.2,max:1,step:0.05,value:0.6},{key:'v',label:'波速 v',min:1,max:4,step:0.5,value:2,unit:'m/s'}],
 draw:(ctx,w,h,s,t)=>{
  const lam=s.v/s.f;const px=w*0.8/8;// 8 m across
  const x0=w*0.1,y0=h*0.45,amp=s.A*h*0.22;

Engine.sim('8a_echo',{title:'回聲測距：d = v × t ÷ 2',note:'按「喊一聲」，看聲音跑到山壁再回來花多久。記得聲音走了「來回」兩趟。',

Engine.sim('8a_pitch',{title:'音調、響度、音色',note:'頻率決定音調，振幅決定響度，波形決定音色。按「聽聽看」可以真的聽到（要開喇叭）。',
 params:[{key:'f',label:'頻率',min:100,max:1000,step:10,value:440,unit:'Hz'},{key:'A',label:'振幅',min:0.1,max:1,step:0.05,value:0.6},{key:'tim',label:'音色',min:0,max:2,step:1,value:0,fmt:v=>['音叉(正弦)','小提琴','笛子'][v]}],
 buttons:[{label:'🔊 聽聽看 (1 秒)',onClick:(s)=>{try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=s.ac||(s.ac=new AC());const g=ac.createGain();g.gain.value=0.15*s.A;const oscs=[[1,1]];if(s.tim===1)oscs.push([2,0.5],[3,0.3],[4,0.2]);if(s.tim===2)oscs.push([3,0.4],[5,0.15]);oscs.forEach(([m,a])=>{const o=ac.createOscillator();o.frequency.value=s.f*m;const gg=ac.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);o.start();o.stop(ac.currentTime+1);});g.connect(ac.destination);}catch(e){}}}],
 draw:(ctx,w,h,s,t)=>{

  const wave=x=>{const ph=2*Math.PI*x;let v=Math.sin(ph);if(s.tim===1)v=(Math.sin(ph)+0.5*Math.sin(2*ph)+0.3*Math.sin(3*ph)+0.2*Math.sin(4*ph))/1.6;if(s.tim===2)v=(Math.sin(ph)+0.4*Math.sin(3*ph)+0.15*Math.sin(5*ph))/1.3;return v;};

Engine.anim('8a_mirror',{title:'平面鏡成像：像在哪裡？',note:'用反射定律作圖，找出鏡子裡的像。',
 steps:[{caption:'物體（黃色蠟燭）放在鏡子前面 3 格的地方',dur:2.5},{caption:'從蠟燭頂端射出兩條光線到鏡面，依反射定律反射',dur:3.5},{caption:'反射光線是發散的，眼睛看到的光「好像」從鏡子後面某一點射出來',dur:3},{caption:'把反射線往鏡後延長（虛線），交會的地方就是像的位置——這是虛像',dur:3.5},{caption:'像與物到鏡面距離相等（都是 3 格）、大小相等、正立、左右相反',dur:3.5}],
 draw:(ctx,w,h,i,p)=>{
  const mx=w/2,g=w*0.09;const oy=h*0.55,ox=mx-3*g,ix=mx+3*g;const H=h*0.22;
  U.grid(ctx,w,h,g);

  candle(ox,C.gold,1);const top=oy-H;

  if(i>=1){hits.forEach(([hx,hy])=>{const q=i===1?p:1;const ex=U.lerp(top<hy?ox:ox,hx,Math.min(1,q*2)),ey=U.lerp(top,hy,Math.min(1,q*2));U.line(ctx,ox,top,ex,ey,C.gold,2);

  if(i>=2&&i<3){U.text(ctx,'👁',mx-g*2.2,oy+H*0.9,C.white,26,'center');}

Engine.sim('8a_curvedmirror',{title:'凹面鏡與凸面鏡',note:'平行光射向鏡子：凹面鏡把光集中到焦點，凸面鏡把光散開。',

 draw:(ctx,w,h,s)=>{
  const cx=w*0.62,cy=h*0.5;const R=h*0.9/s.R;const concave=s.k===0;
  // mirror arc: center at (cx+R) for concave (opening left)... draw arc x = cx + (concave? (R - sqrt(R²-y²)) : -(R - sqrt(R²-y²)))

  for(let k=-4;k<=4;k++){const y=k*h*0.08;if(Math.abs(y)>h*0.38)continue;const d=R-Math.sqrt(Math.max(0,R*R-y*y));const hx=cx+(concave?d:-d);U.arrow(ctx,w*0.05,cy+y,hx,cy+y,C.gold,1.5,6);
   if(concave){const dx=fx-hx,dy=cy-(cy+y);const tEnd=(w*0.05-hx)/dx;U.line(ctx,hx,cy+y,hx+dx*tEnd,cy+y+dy*tEnd,C.blue,1.5);}

Engine.sim('8a_refract',{title:'光的折射：為什麼會偏折？',note:'仿 3b1b 的畫法：看波前（藍色橫線）進入水裡走得慢，整排光就轉向了。拉入射角、換介質。',
 params:[{key:'a',label:'入射角',min:0,max:80,step:1,value:40,unit:'°'},{key:'n',label:'介質',min:0,max:2,step:1,value:0,fmt:v=>['水 n=1.33','玻璃 n=1.5','鑽石 n=2.4'][v]}],
 draw:(ctx,w,h,s,t)=>{
  const n=[1.33,1.5,2.4][s.n];const cx=w/2,cy=h*0.55;const a=s.a*Math.PI/180;const b=Math.asin(Math.sin(a)/n);
  ctx.fillStyle='#58C4DD22';ctx.fillRect(0,cy,w,h-cy);U.line(ctx,0,cy,w,cy,C.blue,1.5);U.text(ctx,'空氣',w*0.06,cy-16,C.grey,13);U.text(ctx,'介質（光走得慢）',w*0.06,cy+18,C.blue,13);
  U.line(ctx,cx,cy-h*0.5,cx,cy+h*0.45,C.dim,1,[6,5]);U.text(ctx,'法線',cx+18,h*0.08,C.dim,12);
  const L=h*0.5;
  // wavefronts along the incident beam
  const dirI=[Math.sin(a),Math.cos(a)],dirR=[Math.sin(b),Math.cos(b)];
  const beam=(dir,col,fromMirror)=>{};
  // incident beam (width)
  const wdt=44;const perpI=[Math.cos(a),-Math.sin(a)],perpR=[Math.cos(b),-Math.sin(b)];

  // wavefronts moving
  const lam=34;const ph=(t*40)%lam;
  for(let k=-14;k<14;k++){const d=k*lam+ph;// distance along beam from interface
   if(d<0){const px=cx+dirI[0]*d,py=cy+dirI[1]*d;if(py<cy)U.line(ctx,px-perpI[0]*wdt,py-perpI[1]*wdt,px+perpI[0]*wdt,py+perpI[1]*wdt,C.blue,2);}
   else{const d2=d/n;const px=cx+dirR[0]*d2,py=cy+dirR[1]*d2;if(py>cy&&py<h)U.line(ctx,px-perpR[0]*wdt,py-perpR[1]*wdt,px+perpR[0]*wdt,py+perpR[1]*wdt,C.blue,2);}}
  ctx.strokeStyle=C.gold;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,40,-Math.PI/2-a,-Math.PI/2);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,40,Math.PI/2-b,Math.PI/2);ctx.stroke();
  U.text(ctx,'入射角 '+s.a+'°',cx-60,cy-60,C.gold,13,'center');U.text(ctx,'折射角 '+U.fmt(b*180/Math.PI,0)+'°',cx+70,cy+60,C.gold,13,'center');
  U.text(ctx,s.a===0?'垂直入射：不偏折，但變慢':'進入介質速度變慢 → 波前間距變短 → 偏向法線',w/2,h*0.96-4,C.yellow,13,'center','700');
 }});

Engine.sim('8a_lens',{title:'凸透鏡成像',note:'拉物距（黃色蠟燭的位置），看像在哪、多大、正立還是倒立。F 是焦點，2F 是兩倍焦距。',

   U.text(ctx,'實像（倒立）',ix,cy-hi+ (hi<0? -18:18)+ (hi<0?0:0),C.red,12,'center');}
  else if(v!==null){const ix=lx+v*px;const iy=cy-hi;// virtual: extend backward
   U.line(ctx,lx,top,lx+(lx-ix)*0.4,top-(iy-top)*0.4*-1,C.gold,1.5);U.line(ctx,lx,top,lx+ w*0.3,top+(top-iy)/(lx-ix)*w*0.3*-1,C.gold,1.5);U.line(ctx,ox,top,ox+w*0.35,top+(top-cy)/(ox-lx)*w*0.35,C.gold,1.5);
   U.line(ctx,lx,top,ix,iy,C.gold,1,[4,4]);U.line(ctx,ox,top,ix,iy,C.gold,1,[4,4]);cand(ix,hi,0.45);U.text(ctx,'虛像（正立放大）',ix,cy-hi-18,C.blue,12,'center');}
  else U.text(ctx,'物體在焦點上：不成像（光線平行射出）',w/2,h*0.12,C.red,13,'center');
  let desc;if(u>2*f)desc='物距 > 2f：縮小、倒立、實像（相機）';else if(Math.abs(u-2*f)<0.3)desc='物距 = 2f：等大、倒立、實像';else if(u>f)desc='2f > 物距 > f：放大、倒立、實像（投影機）';else if(Math.abs(u-f)<0.3)desc='物距 = f：不成像';else desc='物距 < f：放大、正立、虛像（放大鏡）';

 draw:(ctx,w,h,i,p)=>{
  const cy=h*0.5;const mode=i===0?'n':i<=2?'m':i<=4?'h':'s';const len=mode==='m'?w*0.34:mode==='h'?w*0.26:w*0.3;const ex=w*0.45;

  // focus point
  const focusNormal=rx-4;let fx=mode==='m'?rx-4-w*0.09:mode==='h'?rx-4+w*0.08:rx-4;const q=(i===2||i===4)?p:0;fx=U.lerp(fx,rx-4,q);

Engine.sim('8a_tempscale',{title:'攝氏 ↔ 華氏',note:'拉溫度，看兩支溫度計並排的讀數。冰點與沸點是對照的關鍵：0°C=32°F、100°C=212°F。',
 params:[{key:'c',label:'攝氏溫度',min:-40,max:120,step:1,value:25,unit:'°C'}],
 draw:(ctx,w,h,s)=>{
  const f=s.c*9/5+32;
  const therm=(x,val,lo,hi,unit,col,marks)=>{const ty=h*0.12,th=h*0.68;U.rect(ctx,x-8,ty,16,th,'#1a2030',C.grey,1);const fr=U.clamp((val-lo)/(hi-lo),0,1);ctx.fillStyle=col;ctx.fillRect(x-5,ty+th*(1-fr),10,th*fr);U.circle(ctx,x,ty+th+10,14,col);
   marks.forEach(([v,l])=>{const y=ty+th*(1-(v-lo)/(hi-lo));U.line(ctx,x+8,y,x+18,y,C.white,1);U.text(ctx,l,x+22,y,C.dim,11);});
   U.text(ctx,U.fmt(val,0)+' '+unit,x,ty-16,col,16,'center','700');};
  therm(w*0.3,s.c,-40,120,'°C',C.blue,[[0,'0 冰點'],[100,'100 沸點'],[37,'37 體溫']]);
  therm(w*0.62,f,-40,248,'°F',C.red,[[32,'32 冰點'],[212,'212 沸點'],[98.6,'98.6 體溫']]);
  U.text(ctx,'°F = °C × 9/5 + 32',w*0.5,h*0.9,C.white,15,'center');
  U.text(ctx,'= '+s.c+' × 9/5 + 32 = '+U.fmt(f,1),w*0.5,h*0.97-4,C.yellow,14,'center','700');
 }});

Engine.anim('8a_equilib',{title:'熱平衡：熱往哪裡流？',note:'把熱的鐵塊放進冷水裡，看溫度怎麼變。',
 steps:[{caption:'80°C 的鐵塊放進 20°C 的水裡',dur:2.5},{caption:'熱從高溫的鐵塊流向低溫的水：鐵塊降溫、水升溫',dur:4},{caption:'溫差越來越小，熱流越來越慢……',dur:3},{caption:'兩者溫度相同時，熱不再流動——達到熱平衡',dur:3},{caption:'熱總是由高溫流向低溫，直到溫度相等；溫度計也是靠熱平衡讀出溫度',dur:3}],
 draw:(ctx,w,h,i,p)=>{
  const q=i<1?0:i===1?p*0.6:i===2?0.6+p*0.35:i===3?0.95+p*0.05:1;const Tw=U.lerp(20,35,q),Ti=U.lerp(80,35,q);
  const bx=w*0.15,bw=w*0.35,by=h*0.2,bh=h*0.65;
  ctx.fillStyle=U.tempColor(Tw,0,100);ctx.globalAlpha=0.35;ctx.fillRect(bx,by+bh*0.15,bw,bh*0.85);ctx.globalAlpha=1;ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by);ctx.stroke();
  const ix=bx+bw/2,iy=by+bh*0.55;U.rect(ctx,ix-35,iy-25,70,50,U.tempColor(Ti,0,100),C.white,1);U.text(ctx,'鐵塊 '+U.fmt(Ti,0)+'°C',ix,iy,'#111',13,'center','700');
  U.text(ctx,'水 '+U.fmt(Tw,0)+'°C',bx+bw/2,by+bh*0.3,C.white,14,'center','700');
  if(i>=1&&i<3){const n=Math.round(6*(1-q));for(let k=0;k<n;k++){const a=k/6*Math.PI*2;U.arrow(ctx,ix+Math.cos(a)*40,iy+Math.sin(a)*30,ix+Math.cos(a)*70,iy+Math.sin(a)*55,C.red,2,7);}}
  // graph
  const ax=U.axes(ctx,w*0.6,h*0.8,w*0.33,h*0.6,{xl:'時間',yl:'溫度(°C)',xmax:1,ymax:100});
  [20,35,80].forEach(v=>U.text(ctx,String(v),ax.x0-6,ax.y(v),C.grey,11,'right'));
  const pts1=[],pts2=[];for(let x=0;x<=q;x+=0.02){const e=1-Math.exp(-x*4);pts1.push([x,U.lerp(80,35,e)]);pts2.push([x,U.lerp(20,35,e)]);}
  U.plot(ctx,ax,pts1,C.red);U.plot(ctx,ax,pts2,C.blue);U.line(ctx,ax.x(0),ax.y(35),ax.x(1),ax.y(35),C.dim,1,[3,3]);
  U.text(ctx,'鐵塊',ax.x(0.05),ax.y(84),C.red,11);U.text(ctx,'水',ax.x(0.05),ax.y(16),C.blue,11);
  if(i>=3)U.text(ctx,'熱平衡 35°C',ax.x(0.6),ax.y(42),C.yellow,12,'center');
 }});

Engine.sim('8a_heat',{title:'熱量 H = m × s × ΔT',note:'調質量、比熱、溫度變化，看要多少熱量。比熱大的物質比較「難加熱」。',
 params:[{key:'m',label:'質量 m',min:50,max:500,step:10,value:200,unit:'g'},{key:'mat',label:'物質',min:0,max:3,step:1,value:0,fmt:v=>['水 s=1','酒精 s=0.6','鐵 s=0.11','銅 s=0.09'][v]},{key:'dT',label:'升溫 ΔT',min:5,max:80,step:1,value:30,unit:'°C'}],
 draw:(ctx,w,h,s)=>{
  const ss=[1,0.6,0.11,0.09][s.mat];const names=['水','酒精','鐵','銅'];const H=s.m*ss*s.dT;
  const cols=[C.blue,C.purple,C.grey,'#d98b4a'];
  // block sized by mass, flames by heat
  const bx=w*0.28,by=h*0.55;const sz=30+Math.sqrt(s.m)*3;U.rect(ctx,bx-sz/2,by-sz/2,sz,sz,cols[s.mat]+'88',cols[s.mat],2);U.text(ctx,names[s.mat]+' '+s.m+' g',bx,by,C.white,13,'center','700');
  const nf=U.clamp(Math.round(H/1500),1,10);for(let k=0;k<nf;k++){const fx=bx-sz/2+ (k+0.5)*sz/nf;ctx.fillStyle=k%2?C.red:C.gold;ctx.beginPath();ctx.moveTo(fx-6,by+sz/2+20);ctx.quadraticCurveTo(fx,by+sz/2-10,fx+6,by+sz/2+20);ctx.fill();}
  U.text(ctx,'溫度 +'+s.dT+'°C',bx,by-sz/2-16,C.red,13,'center');
  const tx=w*0.68;U.text(ctx,'H = m × s × ΔT',tx,h*0.25,C.white,16,'center');
  U.text(ctx,'= '+s.m+' × '+ss+' × '+s.dT,tx,h*0.4,C.white,15,'center');
  U.text(ctx,'= '+U.fmt(H,0)+' cal',tx,h*0.56,C.yellow,24,'center','700');
  U.text(ctx,'（1 cal：讓 1 g 水升高 1°C 所需的熱量）',tx,h*0.72,C.dim,11,'center');
  U.text(ctx,'比熱 s = '+ss+' cal/g·°C',tx,h*0.85,cols[s.mat],13,'center');
 }});

Engine.sim('8a_mix',{title:'冷熱水混合後的溫度',note:'放出的熱＝吸收的熱。拉兩杯水的質量與溫度，看平衡溫度往哪邊偏。',
 params:[{key:'m1',label:'熱水質量',min:50,max:400,step:10,value:200,unit:'g'},{key:'T1',label:'熱水溫度',min:50,max:100,step:1,value:80,unit:'°C'},{key:'m2',label:'冷水質量',min:50,max:400,step:10,value:200,unit:'g'}],
 draw:(ctx,w,h,s)=>{
  const T2=20;const T=(s.m1*s.T1+s.m2*T2)/(s.m1+s.m2);
  const cup=(x,m,Tc,label)=>{const cw=90,ch=U.lerp(40,150,(m-50)/350);const y=h*0.72;ctx.fillStyle=U.tempColor(Tc,0,100);ctx.globalAlpha=0.5;ctx.fillRect(x-cw/2,y-ch,cw,ch);ctx.globalAlpha=1;ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-cw/2,y-160);ctx.lineTo(x-cw/2,y);ctx.lineTo(x+cw/2,y);ctx.lineTo(x+cw/2,y-160);ctx.stroke();U.text(ctx,label,x,y+18,C.grey,12,'center');U.text(ctx,m+' g，'+U.fmt(Tc,0)+'°C',x,y-ch-14,C.white,13,'center');};
  cup(w*0.18,s.m1,s.T1,'熱水');cup(w*0.5,s.m2,T2,'冷水');U.text(ctx,'+',w*0.34,h*0.45,C.white,24,'center');U.text(ctx,'→',w*0.66,h*0.45,C.white,24,'center');cup(w*0.83,s.m1+s.m2,T,'混合後');
  U.text(ctx,'熱水放熱 '+s.m1+'×1×('+s.T1+'−T) = 冷水吸熱 '+s.m2+'×1×(T−20)',w/2,h*0.1,C.white,13,'center');
  U.text(ctx,'平衡溫度 T = '+U.fmt(T,1)+' °C',w/2,h*0.2,C.yellow,18,'center','700');
  U.text(ctx,s.m1>s.m2?'熱水比較多 → 平衡溫度偏向熱水':s.m1<s.m2?'冷水比較多 → 平衡溫度偏向冷水':'質量相同 → 剛好平均',w/2,h*0.95,C.dim,12,'center');
 }});

Engine.anim('8a_expand',{title:'熱脹冷縮：粒子怎麼了？',note:'加熱時粒子沒有變大，是振動變劇烈、彼此距離變大。',
 steps:[{caption:'常溫的金屬球剛好能穿過金屬環',dur:3},{caption:'加熱金屬球：粒子振動變劇烈，彼此之間的距離變大',dur:4},{caption:'整顆球變大了，卡在環上穿不過去——這就是熱脹',dur:3},{caption:'冷卻後粒子安靜下來、距離縮小，球又能穿過去——冷縮',dur:3.5},{caption:'膨脹程度：氣體 > 液體 > 固體；粒子本身大小不變，變的是間距',dur:3}],
 draw:(ctx,w,h,i,p,t)=>{
  const heat=i<1?0:i===1?p:i===2?1:i===3?1-p:0;
  const cx=w*0.3,cy=h*0.5;const R=h*0.2*(1+heat*0.12);
  // ring
  ctx.strokeStyle='#cfd6e6';ctx.lineWidth=8;ctx.beginPath();ctx.arc(cx,cy+h*0.32,h*0.21,0,Math.PI*2);ctx.stroke();
  const by=i===2?cy+h*0.1:i<1||i===4?cy+h*0.32:cy;const ballY=i===3?U.lerp(cy,cy+h*0.32,p):by;
  ctx.fillStyle=U.tempColor(20+heat*80,0,100);ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(cx,ballY,R,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.stroke();
  if(heat>0.05&&i<3)for(let k=0;k<4;k++){const fx=cx-40+k*27;ctx.fillStyle=k%2?C.red:C.gold;ctx.beginPath();ctx.moveTo(fx-7,h*0.95);ctx.quadraticCurveTo(fx,h*0.95-30*heat-10,fx+7,h*0.95);ctx.fill();}
  // particle zoom
  const zx=w*0.72,zy=h*0.5,gap=28*(1+heat*0.35);U.rect(ctx,zx-95,zy-95,190,190,'#ffffff08',C.line,1);U.text(ctx,'放大看粒子',zx,zy-108,C.dim,12,'center');
  for(let r=-2;r<=2;r++)for(let c=-2;c<=2;c++){const amp=1+heat*4;const px=zx+c*gap+Math.sin(t*12+r*3+c)*amp,py=zy+r*gap+Math.cos(t*11+c*2+r)*amp;U.circle(ctx,px,py,8,U.tempColor(20+heat*80,0,100));}
  U.text(ctx,i===2?'卡住了！':i===0||i===4?'穿過去':'',cx,cy-h*0.3,C.yellow,15,'center','700');
  U.text(ctx,'粒子間距 '+U.fmt(100*(1+heat*0.35),0)+'%',zx,zy+108,C.white,12,'center');
 }});

Engine.sim('8a_heatcurve',{title:'加熱曲線：冰 → 水 → 水蒸氣',note:'拉「加熱時間」，看溫度與狀態。融化與沸騰時溫度停住不動，熱都拿去改變狀態了。',
 params:[{key:'t',label:'加熱時間',min:0,max:20,step:0.1,value:0,unit:'分'}],
 draw:(ctx,w,h,s)=>{
  const seg=[[0,2,-20,0,'冰'],[2,6,0,0,'冰＋水（融化中）'],[6,12,0,100,'水'],[12,18,100,100,'水＋水蒸氣（沸騰中）'],[18,20,100,130,'水蒸氣']];
  const cur=seg.find(g=>s.t>=g[0]&&s.t<=g[1])||seg[4];const T=U.lerp(cur[2],cur[3],(s.t-cur[0])/(cur[1]-cur[0]));
  const ax=U.axes(ctx,w*0.1,h*0.85,w*0.52,h*0.7,{xl:'時間(分)',yl:'溫度(°C)',xmax:20,ymax:150});
  [-20,0,100].forEach(v=>{U.text(ctx,String(v),ax.x0-6,ax.y(v+20)-(v===-20?0:0),C.grey,11,'right');});
  const pts=[];for(let x=0;x<=s.t;x+=0.1){const g=seg.find(g=>x>=g[0]&&x<=g[1])||seg[4];pts.push([x,U.lerp(g[2],g[3],(x-g[0])/(g[1]-g[0]))+20]);}
  U.plot(ctx,ax,pts,C.red);U.glow(ctx,ax.x(s.t),ax.y(T+20),12,C.yellow);
  U.line(ctx,ax.x0,ax.y(20),ax.x(20),ax.y(20),C.dim,1,[3,3]);U.line(ctx,ax.x0,ax.y(120),ax.x(20),ax.y(120),C.dim,1,[3,3]);
  U.text(ctx,'熔點 0°C',ax.x(19),ax.y(28),C.dim,11,'right');U.text(ctx,'沸點 100°C',ax.x(19),ax.y(128),C.dim,11,'right');
  // beaker
  const bx=w*0.72,bw=w*0.2,by=h*0.2,bh=h*0.55;const stage=seg.indexOf(cur);
  ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by);ctx.stroke();
  const ice=stage===0?1:stage===1?1-(s.t-2)/4:0;const water=stage===0?0:stage===1?(s.t-2)/4:stage===2?1:stage===3?1-(s.t-12)/6:0;
  if(water>0){ctx.fillStyle='#58C4DD66';ctx.fillRect(bx,by+bh-bh*0.6*water,bw,bh*0.6*water);}
  if(ice>0){ctx.fillStyle='#e0f4ff';const isz=bw*0.5*ice;ctx.fillRect(bx+bw/2-isz/2,by+bh-bh*0.6*water-isz*0.6,isz,isz*0.6);}
  if(stage>=3){const nv=stage===4?16:4+Math.round((s.t-12)/6*8);for(let k=0;k<nv;k++){U.circle(ctx,bx+10+((k*53)%(bw-20)),by+20+((k*37+s.t*30)%(bh*(stage===4?0.9:0.35))),3,'#ffffff77');}}
  U.text(ctx,cur[4],bx+bw/2,by-14,C.white,13,'center','700');U.text(ctx,U.fmt(T,0)+'°C',bx+bw/2,by+bh+18,C.yellow,15,'center','700');
  if(stage===1||stage===3)U.text(ctx,'溫度不變，熱用來改變狀態',bx+bw/2,by+bh+38,C.gold,11,'center');
 }});

Engine.anim('8a_transfer',{title:'傳導、對流、輻射',note:'三種傳熱方式，各看一個例子。',
 steps:[{caption:'傳導：湯匙一端加熱，粒子振動一個推一個往上傳，整支變熱。固體主要靠傳導',dur:4},{caption:'對流：燒開水時，底部的水受熱變輕上升，上面的冷水下降，形成循環。液體與氣體靠對流',dur:4},{caption:'輻射：太陽的熱穿過真空到地球，不需要介質。任何高溫物體都會放出輻射熱',dur:4},{caption:'傳導靠碰撞、對流靠流動、輻射靠電磁波，三種常常同時發生',dur:3}],
 draw:(ctx,w,h,i,p,t)=>{
  const col=[w*0.17,w*0.5,w*0.83];
  // conduction
  const draw1=q=>{const x=col[0],y0=h*0.8,L=h*0.55;for(let k=0;k<10;k++){const f=U.clamp(q*1.4-k/10,0,1);U.rect(ctx,x-10,y0-(k+1)*L/10,20,L/10-1,U.tempColor(20+f*80,0,100));}for(let k=0;k<3;k++){const fx=x-16+k*16;ctx.fillStyle=k%2?C.red:C.gold;ctx.beginPath();ctx.moveTo(fx-6,y0+18);ctx.quadraticCurveTo(fx,y0-12,fx+6,y0+18);ctx.fill();}U.text(ctx,'傳導',x,h*0.12,C.red,15,'center','700');};
  const draw2=q=>{const x=col[1],bx=x-55,by=h*0.28,bw=110,bh=h*0.5;ctx.fillStyle='#58C4DD33';ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);for(let k=0;k<3;k++){const fx=x-20+k*20;ctx.fillStyle=k%2?C.red:C.gold;ctx.beginPath();ctx.moveTo(fx-6,by+bh+22);ctx.quadraticCurveTo(fx,by+bh-8,fx+6,by+bh+22);ctx.fill();}
   for(let k=0;k<8;k++){const ph=(t*0.6*q+k/8)%1;const ang=ph*Math.PI*2;const px=x+Math.sin(ang)*40,py=by+bh/2+Math.cos(ang)*bh*0.38;U.circle(ctx,px,py,5,Math.cos(ang)>0?C.blue:C.red);}
   U.arrow(ctx,x,by+bh-15,x,by+15,C.red,1.5,7);U.arrow(ctx,x+45,by+15,x+45,by+bh-15,C.blue,1.5,7);U.arrow(ctx,x-45,by+15,x-45,by+bh-15,C.blue,1.5,7);U.text(ctx,'對流',x,h*0.12,C.blue,15,'center','700');};
  const draw3=q=>{const x=col[2];U.glow(ctx,x,h*0.3,40,C.gold);U.circle(ctx,x,h*0.3,18,C.yellow);for(let k=0;k<5;k++){const a=Math.PI*0.3+k*0.1;const r1=30,r2=30+q*h*0.35;ctx.strokeStyle=C.gold;ctx.lineWidth=1.5;ctx.beginPath();for(let s2=0;s2<=1;s2+=0.05){const r=U.lerp(r1,r2,s2);const px=x+Math.cos(a)*r+Math.sin(s2*20+t*8)*3,py=h*0.3+Math.sin(a)*r;s2===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.stroke();}
   ctx.fillStyle='#3d7c47';ctx.beginPath();ctx.arc(x+10,h*0.95,50,Math.PI,0);ctx.fill();U.text(ctx,'真空也能傳',x,h*0.62,C.dim,11,'center');U.text(ctx,'輻射',x,h*0.12,C.gold,15,'center','700');};
  draw1(i===0?p:i>0?1:0);if(i>=1)draw2(i===1?p:1);if(i>=2)draw3(i===2?p:1);
 }});

/* ===== 第6章 探索物質組成 ===== */
Engine.anim('8a_metal',{title:'金屬 vs 非金屬',note:'用三個測試分辨：光澤、導電、敲擊。',
 steps:[{caption:'左邊是銅片（金屬），右邊是硫磺塊（非金屬）',dur:2.5},{caption:'測試一：光澤——金屬有金屬光澤，非金屬多半沒有',dur:3},{caption:'測試二：接上電路——金屬導電燈泡亮，非金屬不導電（石墨例外）',dur:3.5},{caption:'測試三：敲一敲——金屬有延展性會變形，非金屬易碎裂開',dur:3.5},{caption:'元素符號：第一個字母大寫、第二個小寫，例如 Cu（銅）、S（硫）、Fe（鐵）、O（氧）',dur:3.5}],
 draw:(ctx,w,h,i,p)=>{
  const lx=w*0.28,rx=w*0.72,cy=h*0.5;
  const shine=i>=1;
  // copper
  const q3=i===3?p:i>3?1:0;
  U.rect(ctx,lx-60-q3*20,cy-25+q3*8,120+q3*40,50-q3*16,'#d98b4a',C.white,1);if(shine){U.glow(ctx,lx-30,cy-15,22,'#ffffff');}
  U.text(ctx,'銅 Cu（金屬）',lx,cy-60,C.gold,15,'center','700');
  // sulfur
  if(q3<0.5){U.rect(ctx,rx-50,cy-25,100,50,'#e8d84a',C.white,1);}else{U.poly(ctx,[[rx-50,cy-25],[rx-5,cy-25],[rx-15,cy+25],[rx-55,cy+25]],'#e8d84a',C.white,1);U.poly(ctx,[[rx+5,cy-25],[rx+50,cy-25],[rx+60,cy+25],[rx+5,cy+25]],'#e8d84a',C.white,1);}
  U.text(ctx,'硫 S（非金屬）',rx,cy-60,C.yellow,15,'center','700');
  if(i===1||i>=4){U.text(ctx,'✔ 有光澤',lx,cy+50,C.green,13,'center');U.text(ctx,'✘ 無光澤',rx,cy+50,C.red,13,'center');}

 ]},

 ]}

/* ===== 八下共用小工具 ===== */
const _8b_AC={H:'#f3f4f6',O:C.red,C:'#4a4f5c',N:C.blue,Mg:'#c8d0d8',Na:C.purple,Cl:C.green,Cu:'#d98b4a',Zn:'#a8b4bd',Fe:'#8f96a3',Ca:'#e0c070'};
function _8b_atom(ctx,x,y,el,r){const dark=(el==='H'||el==='Mg'||el==='Zn'||el==='Fe'||el==='Ca');U.circle(ctx,x,y,r,_8b_AC[el]||C.grey,'#0b0f19',1.5);if(r>=6)U.text(ctx,el,x,y,dark?'#222':C.white,Math.max(8,r*0.95),'center','700');}
function _8b_mol(ctx,x,y,layout,r){layout.forEach(a=>_8b_atom(ctx,x+a[1]*r,y+a[2]*r,a[0],r));}
const _8b_L={H2:[['H',-0.9,0],['H',0.9,0]],O2:[['O',-1,0],['O',1,0]],H2O:[['O',0,0],['H',-1.3,0.9],['H',1.3,0.9]],C:[['C',0,0]],CO2:[['O',-2,0],['C',0,0],['O',2,0]],Mg:[['Mg',0,0]],MgO:[['Mg',-1,0],['O',1,0]],CH4:[['C',0,0],['H',-1.4,-1],['H',1.4,-1],['H',-1.4,1],['H',1.4,1]],NaCl:[['Na',-1,0],['Cl',1,0]],CuO:[['Cu',-1,0],['O',1,0]],Cu:[['Cu',0,0]]};
const _8b_sup=n=>String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');
const _8b_sub=n=>String(n).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'[+c]).join('');
function _8b_beaker(ctx,x,y,bw,bh,liquidLevel,col){if(liquidLevel>0){ctx.fillStyle=col;ctx.fillRect(x,y+bh*(1-liquidLevel),bw,bh*liquidLevel);}ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+bh);ctx.lineTo(x+bw,y+bh);ctx.lineTo(x+bw,y);ctx.stroke();}
function _8b_flask(ctx,x,y,sz,col){ctx.beginPath();ctx.moveTo(x-sz*0.12,y-sz);ctx.lineTo(x-sz*0.12,y-sz*0.62);ctx.lineTo(x-sz*0.45,y);ctx.lineTo(x+sz*0.45,y);ctx.lineTo(x+sz*0.12,y-sz*0.62);ctx.lineTo(x+sz*0.12,y-sz);ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-sz*0.3,y-sz*0.28);ctx.lineTo(x-sz*0.45,y);ctx.lineTo(x+sz*0.45,y);ctx.lineTo(x+sz*0.3,y-sz*0.28);ctx.closePath();ctx.fill();}

/* ===== 第1章 化學反應 ===== */
Engine.anim('8b_conserve',{title:'質量守恆定律：反應前後秤一秤',note:'密閉容器裡反應，天平讀數不變；開口容器生成的氣體跑掉，讀數才會變小。',
 steps:[{caption:'密閉錐形瓶：大理石與稀鹽酸，瓶口綁著氣球，天平讀數 150.0 g',dur:2.5},{caption:'搖一搖讓大理石掉進鹽酸，開始反應，冒出二氧化碳',dur:3},{caption:'氣體被關在瓶裡（氣球鼓起來），天平讀數仍然是 150.0 g',dur:3},{caption:'換成開口的燒杯，做一樣的反應',dur:2.5},{caption:'二氧化碳跑到空氣中，讀數變成 148.9 g——少掉的正是逸出的氣體',dur:3.5},{caption:'質量守恆定律：反應前後總質量不變，原子只是重新組合',dur:3}],
 draw:(ctx,w,h,i,p,t)=>{
  const scale=(cx,by,read,label)=>{U.rect(ctx,cx-w*0.13,by,w*0.26,8,'#888');U.rect(ctx,cx-w*0.1,by+8,w*0.2,h*0.13,'#2a2f3a',C.grey,1);U.rect(ctx,cx-w*0.07,by+16,w*0.14,26,'#0f2a1a',C.green,1);U.text(ctx,read,cx,by+29,C.green,16,'center','700');U.text(ctx,label,cx,by+8+h*0.13+12,C.dim,12,'center');};
  const bubbles=(x,y0,y1,n)=>{for(let k=0;k<n;k++){const yy=y0-((t*50+k*23)%(y0-y1));U.circle(ctx,x-18+(k*11)%36,yy,3,null,C.white,1);}};
  // closed flask
  const lx=w*0.27,by=h*0.6,sz=h*0.42;
  scale(lx,by,'150.0 g','密閉錐形瓶＋氣球');
  _8b_flask(ctx,lx,by,sz,'#58C4DD44');
  ctx.fillStyle='#bbb';for(let k=0;k<4;k++)ctx.fillRect(lx-24+k*13,by-10,9,7);
  const q1=i===1?p:i>1?1:0;
  if(i===1)bubbles(lx,by-8,by-sz*0.3,8);
  const br=8+22*q1;U.circle(ctx,lx,by-sz-br,br,'#FC625566',C.red,1.5);
  if(i>=1)U.text(ctx,'CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂',w/2,h*0.07,C.white,14,'center');
  if(i===2||i>=5)U.text(ctx,'反應後仍是 150.0 g',lx,h*0.16,C.green,14,'center','700');
  // open beaker
  if(i>=3){const a=i===3?p:1;ctx.save();ctx.globalAlpha=a;const rx=w*0.73;
   const read=i<4?'150.0 g':i===4?U.fmt(U.lerp(150,148.9,p),1)+' g':'148.9 g';
   scale(rx,by,read,'開口燒杯');
   const bw2=sz*0.7,bh2=sz*0.8;_8b_beaker(ctx,rx-bw2/2,by-bh2,bw2,bh2,0.45,'#58C4DD44');
   ctx.fillStyle='#bbb';for(let k=0;k<4;k++)ctx.fillRect(rx-24+k*13,by-10,9,7);
   if(i>=3)bubbles(rx,by-8,by-bh2*0.45,8);
   if(i>=4){for(let k=0;k<6;k++){const yy=by-bh2-10-((t*35+k*29)%(h*0.3));const xx=rx-30+(k*17)%60+Math.sin(t*2+k)*6;U.text(ctx,'CO₂',xx,yy,C.grey,11,'center');}}
   if(i>=4)U.text(ctx,'少了 1.1 g ＝ 逸出的 CO₂',rx,h*0.16,C.gold,14,'center','700');
   ctx.restore();}
  if(i===5){U.rect(ctx,w*0.12,h*0.36,w*0.76,h*0.14,'#0b0f19ee',C.yellow,1);U.text(ctx,'反應前總質量 ＝ 反應後總質量',w/2,h*0.43,C.yellow,18,'center','700');}
 }});

Engine.sim('8b_mole',{title:'莫耳：把分子一「袋」一「袋」算',note:'1 莫耳＝6×10²³ 個粒子，一袋的質量剛好是分子量的公克數。拉莫耳數，看質量與個數怎麼變。',
 params:[{key:'sub',label:'物質',min:0,max:4,step:1,value:2,fmt:v=>['H₂','O₂','H₂O','CO₂','NaCl'][v]},{key:'n',label:'莫耳數',min:0.5,max:5,step:0.5,value:1,unit:'mol'}],
 draw:(ctx,w,h,s)=>{
  const S=[{f:'H₂',M:2,l:_8b_L.H2,c:'H：1 × 2 = 2'},{f:'O₂',M:32,l:_8b_L.O2,c:'O：16 × 2 = 32'},{f:'H₂O',M:18,l:_8b_L.H2O,c:'H：1 × 2 ＋ O：16 = 18'},{f:'CO₂',M:44,l:_8b_L.CO2,c:'C：12 ＋ O：16 × 2 = 44'},{f:'NaCl',M:58.5,l:_8b_L.NaCl,c:'Na：23 ＋ Cl：35.5 = 58.5'}][s.sub];
  U.rect(ctx,w*0.04,h*0.08,w*0.3,h*0.86,'#ffffff08',C.line,1);
  _8b_mol(ctx,w*0.19,h*0.3,S.l,13);
  U.text(ctx,S.f,w*0.19,h*0.53,C.white,20,'center','700');
  U.text(ctx,S.f==='NaCl'?'式量':'分子量',w*0.19,h*0.64,C.dim,12,'center');
  U.text(ctx,S.c,w*0.19,h*0.73,C.gold,12,'center');
  U.text(ctx,'1 mol = '+S.M+' g',w*0.19,h*0.86,C.gold,15,'center','700');
  const bx0=w*0.4,bw=w*0.56,cw=bw/5;
  U.text(ctx,'每袋 6×10²³ 個粒子',bx0+bw/2,h*0.08,C.dim,12,'center');
  for(let k=0;k<5;k++){const cx=bx0+cw*(k+0.5),cy=h*0.32;const fill=U.clamp(s.n-k,0,1);const r=Math.min(cw*0.42,h*0.15);
   U.circle(ctx,cx,cy,r,null,fill>0?C.blue:C.line,1.5);
   if(fill<=0)continue;
   ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.fillStyle=C.blue+'33';ctx.fillRect(cx-r,cy+r-2*r*fill,2*r,2*r*fill);ctx.restore();
   for(let j=0;j<6;j++){const a=j/6*6.283;const px=cx+Math.cos(a)*r*0.55,py=cy+Math.sin(a)*r*0.55;if(py>cy+r-2*r*fill)_8b_mol(ctx,px,py,S.l,3);}
   U.text(ctx,fill>=1?'1 mol':U.fmt(fill,1)+' mol',cx,cy+r+12,C.blue,11,'center');}
  const mass=S.M*s.n,num=s.n*6;
  U.text(ctx,'質量 = '+U.fmt(s.n,1)+' × '+S.M+' = '+U.fmt(mass,1)+' g',bx0+bw/2,h*0.66,C.yellow,16,'center','700');
  U.text(ctx,'個數 = '+U.fmt(s.n,1)+' × 6×10²³ = '+U.fmt(num,1)+'×10²³ 個',bx0+bw/2,h*0.8,C.teal,15,'center','700');
  U.text(ctx,'質量 = 莫耳數 × 分子量',bx0+bw/2,h*0.92,C.dim,12,'center');
 }});

Engine.sim('8b_balance',{title:'平衡化學反應式',note:'拉係數，讓左右兩邊每一種原子的個數一樣多。平衡時綠燈會亮。',
 params:[{key:'rxn',label:'反應',min:0,max:3,step:1,value:0,fmt:v=>['氫氣燃燒','碳燃燒','鎂燃燒','甲烷燃燒'][v]},{key:'a',label:'係數 ①',min:1,max:4,step:1,value:1},{key:'b',label:'係數 ②',min:1,max:4,step:1,value:1}],
 draw:(ctx,w,h,s)=>{
  const RX=[
   {re:[{f:'H₂',l:_8b_L.H2,at:{H:2}},{f:'O₂',l:_8b_L.O2,at:{O:2}}],pr:[{f:'H₂O',l:_8b_L.H2O,at:{H:2,O:1}}],adj:[0,2]},
   {re:[{f:'C',l:_8b_L.C,at:{C:1}},{f:'O₂',l:_8b_L.O2,at:{O:2}}],pr:[{f:'CO₂',l:_8b_L.CO2,at:{C:1,O:2}}],adj:[0,2]},
   {re:[{f:'Mg',l:_8b_L.Mg,at:{Mg:1}},{f:'O₂',l:_8b_L.O2,at:{O:2}}],pr:[{f:'MgO',l:_8b_L.MgO,at:{Mg:1,O:1}}],adj:[0,2]},
   {re:[{f:'CH₄',l:_8b_L.CH4,at:{C:1,H:4}},{f:'O₂',l:_8b_L.O2,at:{O:2}}],pr:[{f:'CO₂',l:_8b_L.CO2,at:{C:1,O:2}},{f:'H₂O',l:_8b_L.H2O,at:{H:2,O:1}}],adj:[1,3]}][s.rxn];
  const sp=[...RX.re,...RX.pr],nre=RX.re.length,n=sp.length;
  const coef=sp.map((_,k)=>k===RX.adj[0]?s.a:k===RX.adj[1]?s.b:1);
  let eq='';sp.forEach((x,k)=>{eq+=(k===0?'':k===nre?'  →  ':' + ')+(coef[k]>1?coef[k]:'')+x.f;});
  U.text(ctx,eq,w/2,h*0.08,C.white,20,'center','700');
  const cw=w*0.9/n;
  sp.forEach((x,k)=>{const cx=w*0.05+cw*(k+0.5),cy=h*0.36,r=Math.min(9,cw/15);
   for(let j=0;j<coef[k];j++){const gx=cx+((j%2)-0.5)*cw*0.46,gy=cy+(Math.floor(j/2)-0.5)*h*0.22;_8b_mol(ctx,gx,gy,x.l,r);}
   const isAdj=RX.adj.indexOf(k);const col=isAdj>=0?C.yellow:C.grey;
   U.text(ctx,(isAdj>=0?'係數'+['①','②'][isAdj]+'：':'')+coef[k]+' 個 '+x.f,cx,h*0.6,col,12,'center');
   if(k>0)U.text(ctx,k===nre?'→':'+',w*0.05+cw*k,cy,C.dim,22,'center');});
  const els=[];sp.forEach(x=>Object.keys(x.at).forEach(e=>{if(!els.includes(e))els.push(e);}));
  const cnt=(list,off)=>e=>list.reduce((a,x,k)=>a+(x.at[e]||0)*coef[k+off],0);
  const L=cnt(RX.re,0),R=cnt(RX.pr,nre);
  const ty=h*0.7;U.text(ctx,'原子',w*0.2,ty,C.dim,12,'center');U.text(ctx,'左邊',w*0.35,ty,C.dim,12,'center');U.text(ctx,'右邊',w*0.5,ty,C.dim,12,'center');
  let ok=true;els.forEach((e,k)=>{const l=L(e),r=R(e),same=l===r;if(!same)ok=false;const y=ty+18+k*18;U.text(ctx,e,w*0.2,y,C.white,13,'center','700');U.text(ctx,String(l),w*0.35,y,same?C.green:C.red,13,'center','700');U.text(ctx,String(r),w*0.5,y,same?C.green:C.red,13,'center','700');U.text(ctx,same?'✓':'✗',w*0.6,y,same?C.green:C.red,13,'center');});
  const lx=w*0.82,ly=h*0.8;if(ok)U.glow(ctx,lx,ly,34,C.green);U.circle(ctx,lx,ly,16,ok?C.green:'#3a1a1a',ok?C.green:C.red,2);
  U.text(ctx,ok?'平衡了！':'還沒平衡',lx,ly+30,ok?C.green:C.red,14,'center','700');
  U.text(ctx,'兩邊每種原子一樣多',lx,h*0.66,C.dim,11,'center');
 }});

Engine.anim('8b_exo',{title:'放熱反應與吸熱反應',note:'看溫度計往哪邊跑，再看能量圖：反應物和生成物誰的能量高。',

Engine.sim('8b_activity',{title:'金屬活性：誰能把誰換出來',note:'選一種金屬放進溶液，活性大的金屬會把活性小的金屬（或氫）置換出來；活性小的就沒反應。',

 }});

  const cols=['#c1121f','#d62828','#e85d04','#f48c06','#faa307','#ffd60a','#c5e063','#52b788','#2d8f6f','#1e7f9c','#2a6f97','#3a4f9c','#5e3a9c','#6a1b9a','#4a148c'];

  U.text(ctx,ex[ph],kx+kw/2,ky+bh+16,C.white,12,'center');

 }});

Engine.sim('8b_neutral',{title:'酸鹼中和：H⁺ 遇上 OH⁻',note:'往 20 mL 的 0.1 M 鹽酸裡慢慢加 0.1 M 氫氧化鈉，看離子怎麼變、pH 怎麼跳。',

  const pH=V<20?-Math.log10(0.1*(20-V)/(20+V)):V>20?14+Math.log10(0.1*(V-20)/(20+V)):7;
  const bx=w*0.08,bw=w*0.3,by=h*0.2,bh=h*0.62;

  U.rect(ctx,bx+bw/2-6,h*0.02,12,h*0.14,'#333',C.grey,1);U.text(ctx,'NaOH',bx+bw/2+14,h*0.08,C.blue,11,'left');
  const dots=[];for(let k=0;k<Hn;k++)dots.push(['H⁺',C.red]);for(let k=0;k<Math.round(OHn);k++)dots.push(['OH⁻',C.blue]);for(let k=0;k<Math.round(Nan);k++)dots.push(['Na⁺',C.purple]);for(let k=0;k<Cln;k++)dots.push(['Cl⁻',C.green]);for(let k=0;k<Math.round(Wn);k++)dots.push(['H₂O','#8888a0']);

  const lx=w*0.42;U.text(ctx,'離子個數（每格＝2 mL 的量）',lx,h*0.1,C.dim,11,'left');
  [['H⁺',Hn,C.red],['OH⁻',OHn,C.blue],['Na⁺',Nan,C.purple],['Cl⁻',Cln,C.green],['H₂O 生成',Wn,'#8888a0']].forEach((r,k)=>{const y=h*0.2+k*h*0.09;U.text(ctx,r[0],lx,y,r[2],12,'left');U.rect(ctx,lx+w*0.1,y-6,U.fmt(r[1],0)*w*0.008,12,r[2]);U.text(ctx,U.fmt(r[1],0),lx+w*0.1+r[1]*w*0.008+6,y,C.white,11,'left');});
  const ax=U.axes(ctx,w*0.72,h*0.6,w*0.24,h*0.44,{xl:'mL',yl:'pH',xmax:40,ymax:14});
  const pts=[];for(let v=0;v<=40;v+=0.5){const q=v<20?-Math.log10(0.1*(20-v)/(20+v)):v>20?14+Math.log10(0.1*(v-20)/(20+v)):7;pts.push([v,q]);}U.plot(ctx,ax,pts,C.teal,2);
  U.line(ctx,ax.x(0),ax.y(7),ax.x(40),ax.y(7),C.dim,1,[3,3]);U.text(ctx,'7',ax.x0-8,ax.y(7),C.grey,10,'right');U.text(ctx,'20',ax.x(20),ax.y0+10,C.grey,10,'center');
  U.glow(ctx,ax.x(V),ax.y(pH),12,C.yellow);U.circle(ctx,ax.x(V),ax.y(pH),4,C.white);
  U.text(ctx,'pH = '+U.fmt(pH,1),w*0.84,h*0.72,pH<6.5?C.red:pH>7.5?C.blue:C.green,18,'center','700');
  const st=V<20?'酸性：H⁺ 還有剩':V===20?'剛好中和：H⁺ 和 OH⁻ 用完，pH = 7':'鹼性：OH⁻ 多出來';
  U.text(ctx,st,w*0.72,h*0.85,V===20?C.green:C.white,12,'center');
  U.text(ctx,'H⁺ + OH⁻ → H₂O　　Na⁺ + Cl⁻ 留下來成為鹽（NaCl）',w*0.7,h*0.95,C.yellow,12,'center');
 }});

/* ===== 第4章 反應速率與化學平衡 ===== */
Engine.sim('8b_rate',{title:'反應速率：有效碰撞越多越快',note:'藍色粒子撞到固體（黃色）才算一次有效碰撞。拉溫度、濃度、顆粒大小，看每秒碰幾次。',
 params:[{key:'T',label:'溫度',min:20,max:80,step:5,value:40,unit:'°C'},{key:'n',label:'濃度（粒子數）',min:10,max:40,step:5,value:20,unit:'個'},{key:'sz',label:'固體顆粒',min:0,max:1,step:1,value:0,fmt:v=>v?'粉末（表面積大）':'大顆粒'}],
 init:s=>{s.ps=[];for(let k=0;k<40;k++)s.ps.push({x:U.rnd(10,390),y:U.rnd(10,120),a:U.rnd(0,6.283)});s.hits=0;s.acc=0;s.rate=0;s.fl=[];},
 step:(s,dt)=>{const sp=(0.5+(s.T-20)/60*1.5)*140;const rects=s.sz?[0,1,2,3,4,5,6,7,8].map(k=>({x:95+(k%3)*80,y:150+Math.floor(k/3)*55,w:30,h:30})):[{x:155,y:170,w:90,h:90}];s.rects=rects;
  for(let k=0;k<s.n;k++){const p=s.ps[k];p.x+=Math.cos(p.a)*sp*dt;p.y+=Math.sin(p.a)*sp*dt;
   if(p.x<6){p.x=6;p.a=Math.PI-p.a;}if(p.x>394){p.x=394;p.a=Math.PI-p.a;}if(p.y<6){p.y=6;p.a=-p.a;}if(p.y>294){p.y=294;p.a=-p.a;}
   rects.forEach(r=>{const cx=U.clamp(p.x,r.x,r.x+r.w),cy=U.clamp(p.y,r.y,r.y+r.h);const dx=p.x-cx,dy=p.y-cy;if(dx*dx+dy*dy<36){s.hits++;s.fl.push({x:cx,y:cy,a:0});if(Math.abs(dx)>Math.abs(dy)){p.a=Math.PI-p.a;p.x=cx+(dx>0?6:-6);}else{p.a=-p.a;p.y=cy+(dy>0?6:-6);}}});}
  s.acc+=dt;if(s.acc>=1){s.rate=s.hits;s.hits=0;s.acc=0;}
  s.fl.forEach(f=>f.a+=dt*4);s.fl=s.fl.filter(f=>f.a<1);},
 draw:(ctx,w,h,s)=>{
  const bx=w*0.05,by=h*0.1,bw=w*0.52,bh=h*0.82;const sx=bw/400,sy=bh/300;
  U.rect(ctx,bx,by,bw,bh,'#ffffff06',C.white,1.5);
  (s.rects||[]).forEach(r=>U.rect(ctx,bx+r.x*sx,by+r.y*sy,r.w*sx,r.h*sy,C.gold));
  s.fl.forEach(f=>U.glow(ctx,bx+f.x*sx,by+f.y*sy,14*(1-f.a),C.yellow));
  for(let k=0;k<s.n;k++){const p=s.ps[k];U.circle(ctx,bx+p.x*sx,by+p.y*sy,5,U.tempColor(s.T,0,100));}
  const tx=w*0.79;
  U.text(ctx,'每秒有效碰撞',tx,h*0.14,C.dim,13,'center');
  U.text(ctx,s.rate+' 次',tx,h*0.26,C.yellow,30,'center','700');
  const sp=0.5+(s.T-20)/60*1.5;
  [['溫度 '+s.T+'°C','粒子速度 ×'+U.fmt(sp,1)],['濃度 '+s.n+' 個','粒子越多越常撞'],[s.sz?'粉末':'大顆粒','表面積 '+(s.sz?'3 倍':'1 倍')]].forEach((r,k)=>{const y=h*0.42+k*h*0.15;U.text(ctx,r[0],tx,y,C.white,13,'center','700');U.text(ctx,r[1],tx,y+16,C.dim,11,'center');});
  U.text(ctx,'碰撞越多 → 反應越快',tx,h*0.92,C.teal,13,'center','700');
 }});

Engine.anim('8b_equil',{title:'可逆反應與化學平衡',note:'正反應和逆反應同時進行；兩邊一樣快的時候，濃度就固定下來了。',
 steps:[{caption:'密閉容器裡一開始只有反應物 A（紅），正反應 A → B 速率最快',dur:3},{caption:'生成物 B（藍）越來越多，逆反應 B → A 也開始，而且越來越快',dur:3},{caption:'A 變少，正反應變慢；B 變多，逆反應變快',dur:3},{caption:'當正反應速率＝逆反應速率，A 和 B 的濃度不再改變——達到化學平衡',dur:3.5},{caption:'平衡時反應並沒有停：兩個方向一樣快，個別粒子還在互換（動態平衡）',dur:3},{caption:'可逆反應在密閉容器裡會達到平衡：濃度固定，反應仍持續進行',dur:3}],
 draw:(ctx,w,h,i,p,t)=>{
  const tau=Math.min(t,12);const fB=0.6*(1-Math.exp(-tau/3.5));
  const bx=w*0.05,by=h*0.12,bw=w*0.4,bh=h*0.7;U.rect(ctx,bx,by,bw,bh,'#ffffff06',C.white,1.5);
  const N=30;const nB=Math.round(N*fB);
  for(let k=0;k<N;k++){const px=bx+14+((k*61)%83)/83*(bw-28)+Math.sin(t*1.3+k*1.7)*5,py=by+14+((k*43)%79)/79*(bh-28)+Math.cos(t*1.1+k)*5;const isB=k<nB;U.circle(ctx,px,py,7,isB?C.blue:C.red);}
  U.text(ctx,'A（紅）'+(N-nB)+' 個　B（藍）'+nB+' 個',bx+bw/2,by+bh+16,C.white,12,'center');
  const rf=1-fB/0.6*0.6,rr=fB/0.6*0.4;const cx=bx+bw/2,ay=h*0.06;
  U.arrow(ctx,cx-20-rf*60,ay-6,cx+20+rf*60,ay-6,C.red,2.5,8);U.arrow(ctx,cx+20+rr*60,ay+6,cx-20-rr*60,ay+6,C.blue,2.5,8);
  U.text(ctx,'正反應',cx-30-rf*60-20,ay,C.red,11,'right');U.text(ctx,'逆反應',cx+30+rr*60+20,ay,C.blue,11,'left');
  const ax=U.axes(ctx,w*0.55,h*0.78,w*0.38,h*0.6,{xl:'時間',yl:'濃度'});
  const pa=[],pb=[];for(let s=0;s<=tau;s+=0.2){const f=0.6*(1-Math.exp(-s/3.5));pa.push([s/12,1-f]);pb.push([s/12,f]);}
  U.plot(ctx,ax,pa,C.red);U.plot(ctx,ax,pb,C.blue);
  U.text(ctx,'[A]',ax.x(Math.min(tau,12)/12)+14,ax.y(1-fB),C.red,12,'left');U.text(ctx,'[B]',ax.x(Math.min(tau,12)/12)+14,ax.y(fB),C.blue,12,'left');
  if(i>=3){U.line(ctx,ax.x(0.75),ax.y0,ax.x(0.75),ax.y(1),C.yellow,1,[4,3]);U.text(ctx,'達平衡',ax.x(0.75),ax.y(1)-10,C.yellow,12,'center');U.text(ctx,'濃度不再變',ax.x(0.88),ax.y(0.5),C.dim,11,'center');}
  if(i>=3)U.text(ctx,'正反應速率 ＝ 逆反應速率',cx,by+bh+34,C.yellow,13,'center','700');
  if(i===5){U.rect(ctx,w*0.15,h*0.86,w*0.7,h*0.12,'#0b0f19ee',C.yellow,1);U.text(ctx,'化學平衡：濃度固定，但反應仍雙向進行',w/2,h*0.92,C.yellow,15,'center','700');}
 }});

Engine.anim('8b_polymer',{title:'從單體到聚合物，還有酒精、醋酸、酯',note:'小分子接成長鏈叫聚合；生活中的塑膠、酒精、醋、香味都是有機化合物。',
 steps:[{caption:'乙烯 C₂H₄ 是小分子（單體），中間有一個碳碳雙鍵',dur:3},{caption:'許多乙烯的雙鍵打開，一個接一個連起來',dur:3.5},{caption:'連成很長的鏈——聚乙烯（PE），塑膠袋的材料；這個反應叫聚合',dur:3},{caption:'酒精（乙醇 C₂H₅OH）：消毒、酒類飲料，可由糖發酵得到',dur:2.5},{caption:'醋酸（CH₃COOH）：食醋的酸味來源，是一種弱酸',dur:2.5},{caption:'酯類：乙醇和醋酸反應生成乙酸乙酯，有水果香味',dur:2.5},{caption:'有機化合物種類很多：小分子可以聚合成高分子；酒精、醋酸、酯類都是常見的有機物',dur:3}],
 draw:(ctx,w,h,i,p)=>{

  else{const gap=U.lerp(w*0.175,r*3.8,q);const x0=w/2-gap*2;for(let k=0;k<5;k++){const x=x0+k*gap;unit(x,cy,q<0.5,r);if(k<4&&q>0.5)U.line(ctx,x+r*1.3,cy,x+gap-r*1.3,cy,C.white,2);}
   if(q>=1){U.text(ctx,'…',x0-gap*0.8,cy,C.white,20,'center');U.text(ctx,'…',x0+gap*4.8,cy,C.white,20,'center');}
   U.text(ctx,q<1?'雙鍵打開，一個接一個':'聚乙烯（PE）：―CH₂―CH₂―CH₂―CH₂―…',w/2,cy+h*0.16,q<1?C.yellow:C.teal,13,'center','700');
   if(i>=2)U.text(ctx,'單體 → 聚合物（聚合反應）',w/2,h*0.08,C.yellow,14,'center','700');}
  const card=(k,title,formula,desc,col,a)=>{ctx.save();ctx.globalAlpha=a;const cw=w*0.28,cx=w*0.06+k*(cw+w*0.03),cy2=h*0.56;U.rect(ctx,cx,cy2,cw,h*0.36,'#ffffff08',col,1);U.text(ctx,title,cx+cw/2,cy2+h*0.07,col,15,'center','700');U.text(ctx,formula,cx+cw/2,cy2+h*0.17,C.white,13,'center');U.text(ctx,desc,cx+cw/2,cy2+h*0.28,C.dim,11,'center');ctx.restore();};
  if(i>=3)card(0,'酒精（乙醇）','C₂H₅OH','消毒、酒類、可由糖發酵',C.blue,i===3?p:1);
  if(i>=4)card(1,'醋酸','CH₃COOH','食醋的酸味，弱酸',C.red,i===4?p:1);
  if(i>=5)card(2,'酯類（乙酸乙酯）','乙醇 + 醋酸 → 酯 + 水','水果香味、香料',C.pink,i===5?p:1);
  if(i===6){U.rect(ctx,w*0.1,h*0.42,w*0.8,h*0.11,'#0b0f19ee',C.yellow,1);U.text(ctx,'塑膠、酒精、醋酸、酯類：都是含碳的有機化合物',w/2,h*0.475,C.yellow,14,'center','700');}
 }});

/* ===== 第6章 力與壓力 ===== */
Engine.sim('8b_hooke',{title:'虎克定律：F = k·x',note:'掛砝碼，看彈簧伸長多少；右邊的 F–x 圖永遠是一條過原點的直線，斜率就是彈簧常數 k。',
 params:[{key:'m',label:'砝碼',min:0,max:500,step:50,value:200,unit:'gw'},{key:'k',label:'彈簧常數 k',min:10,max:50,step:5,value:25,unit:'gw/cm'}],
 init:s=>{s.xv=0;},
 step:(s,dt)=>{const x=s.m/s.k;s.xv+=(x-s.xv)*Math.min(1,dt*6);},
 draw:(ctx,w,h,s)=>{
  const x=s.m/s.k;const pxcm=h*0.6/50;const sx=w*0.22,top=h*0.08,nat=h*0.16;
  U.rect(ctx,sx-60,top-10,120,10,'#666');
  const len=nat+s.xv*pxcm;const coils=12;ctx.strokeStyle=C.grey;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(sx,top);for(let k=0;k<=coils*2;k++){const yy=top+len*k/(coils*2);ctx.lineTo(sx+(k%2?14:-14)*(k===0||k===coils*2?0:1),yy);}ctx.stroke();
  const wy=top+len;if(s.m>0){const bs=18+s.m/500*30;U.rect(ctx,sx-bs/2,wy,bs,bs,C.gold,'#fff',1);U.text(ctx,s.m+' gw',sx,wy+bs+12,C.gold,12,'center','700');}
  U.line(ctx,sx+40,top+nat,sx+40,top+nat+50*pxcm,C.dim,1);for(let c=0;c<=50;c+=10){U.line(ctx,sx+36,top+nat+c*pxcm,sx+44,top+nat+c*pxcm,C.grey,1);U.text(ctx,String(c),sx+50,top+nat+c*pxcm,C.grey,10,'left');}
  U.line(ctx,sx-30,top+nat,sx+44,top+nat,C.blue,1,[3,3]);U.text(ctx,'原長',sx-34,top+nat,C.blue,11,'right');
  if(x>0){U.arrow(ctx,sx+64,top+nat,sx+64,top+nat+s.xv*pxcm,C.red,2,7);U.text(ctx,'x = '+U.fmt(x,1)+' cm',sx+70,top+nat+s.xv*pxcm/2,C.red,12,'left');}
  const ax=U.axes(ctx,w*0.58,h*0.82,w*0.34,h*0.62,{xl:'x (cm)',yl:'F (gw)',xmax:50,ymax:500});
  for(let c=0;c<=50;c+=10)U.text(ctx,String(c),ax.x(c),ax.y0+11,C.grey,10,'center');for(let f=0;f<=500;f+=100)U.text(ctx,String(f),ax.x0-5,ax.y(f),C.grey,10,'right');
  const xm=Math.min(50,500/s.k);U.line(ctx,ax.x(0),ax.y(0),ax.x(xm),ax.y(xm*s.k),C.teal,2.5);
  U.glow(ctx,ax.x(x),ax.y(s.m),14,C.yellow);U.circle(ctx,ax.x(x),ax.y(s.m),5,C.white);
  U.text(ctx,'F = k·x',w*0.75,h*0.1,C.yellow,18,'center','700');
  U.text(ctx,s.m+' = '+s.k+' × '+U.fmt(x,1),w*0.75,h*0.2,C.white,14,'center');
  U.text(ctx,'斜率 = k = '+s.k+' gw/cm',w*0.75,h*0.94,C.teal,12,'center');
 }});

Engine.sim('8b_friction',{title:'摩擦力：推不動 → 推動了',note:'慢慢加大推力：推不動時靜摩擦力和推力一樣大；超過最大靜摩擦力就滑動，換成比較小的動摩擦力。',
 params:[{key:'F',label:'推力',min:0,max:60,step:1,value:0,unit:'N'},{key:'mu',label:'接觸面',min:0,max:2,step:1,value:1,fmt:v=>['光滑 (μ=0.2)','普通 (μ=0.4)','粗糙 (μ=0.6)'][v]},{key:'W',label:'物體重量',min:20,max:100,step:10,value:50,unit:'N'}],
 init:s=>{s.x=0;s.v=0;},
 step:(s,dt)=>{const mu=[0.2,0.4,0.6][s.mu];const fmax=mu*s.W,fk=0.8*fmax;const moving=s.F>fmax;if(moving){s.v+=(s.F-fk)/s.W*60*dt;s.x+=s.v*dt;if(s.x>140){s.x=-0;}}else{s.v=0;s.x*=Math.max(0,1-dt*3);}},
 draw:(ctx,w,h,s)=>{
  const mu=[0.2,0.4,0.6][s.mu];const fmax=mu*s.W,fk=0.8*fmax;const moving=s.F>fmax;const f=moving?fk:s.F;
  const gy=h*0.6,gx=w*0.05,gw=w*0.5;U.line(ctx,gx,gy,gx+gw,gy,C.grey,3);
  const rough=[2,6,12][s.mu];for(let x=gx;x<gx+gw;x+=8)U.line(ctx,x,gy,x+4,gy+rough*0.6,C.dim,1);
  const bs=30+s.W*0.3,bx=gx+40+s.x,by=gy-bs;U.rect(ctx,bx,by,bs,bs,C.gold,'#fff',1);
  if(s.F>0)U.arrow(ctx,bx-s.F*2-6,by+bs/2,bx-4,by+bs/2,C.red,3,9);U.text(ctx,'推力 '+s.F+' N',bx+bs/2,by-26,C.red,13,'center','700');
  if(f>0)U.arrow(ctx,bx+bs+4,by+bs*0.8,bx+bs+4+f*2,by+bs*0.8,C.blue,3,9);
  U.text(ctx,(moving?'動摩擦力 ':'靜摩擦力 ')+U.fmt(f,1)+' N',bx+bs/2,gy+22,C.blue,13,'center','700');
  U.text(ctx,moving?'滑動中！':(s.F>0?'推不動':'沒有推'),bx+bs/2,gy+42,moving?C.green:C.grey,13,'center');
  U.text(ctx,'重量 '+s.W+' N',bx+bs/2,by+bs/2,'#222',11,'center');
  const ax=U.axes(ctx,w*0.62,h*0.8,w*0.32,h*0.6,{xl:'推力',yl:'摩擦力',xmax:60,ymax:60});
  U.line(ctx,ax.x(0),ax.y(0),ax.x(fmax),ax.y(fmax),C.blue,2.5);U.line(ctx,ax.x(fmax),ax.y(fmax),ax.x(fmax),ax.y(fk),C.blue,1.5,[3,3]);U.line(ctx,ax.x(fmax),ax.y(fk),ax.x(60),ax.y(fk),C.blue,2.5);
  U.text(ctx,'最大靜摩擦 '+U.fmt(fmax,0),ax.x(fmax),ax.y(fmax)-12,C.yellow,11,'center');U.text(ctx,'動摩擦 '+U.fmt(fk,0),ax.x(60),ax.y(fk)+12,C.dim,11,'right');
  U.glow(ctx,ax.x(s.F),ax.y(f),12,C.yellow);U.circle(ctx,ax.x(s.F),ax.y(f),4,C.white);
  U.text(ctx,'最大靜摩擦力 = μ × 正向力 = '+mu+' × '+s.W+' = '+U.fmt(fmax,0)+' N',w/2,h*0.94,C.dim,12,'center');
  U.text(ctx,'越粗糙、越重 → 摩擦力越大',w*0.3,h*0.1,C.white,13,'center');
 }});

Engine.sim('8b_pressure',{title:'壓力 P = F / A',note:'同樣的力，受力面積越小，壓力越大、壓痕越深。',
 params:[{key:'F',label:'作用力 F',min:10,max:200,step:10,value:100,unit:'N'},{key:'A',label:'受力面積 A',min:1,max:50,step:1,value:10,unit:'cm²'}],
 draw:(ctx,w,h,s)=>{
  const P=s.F/s.A;const gy=h*0.62,gx=w*0.05,gw=w*0.55;
  const depth=U.clamp(P*1.6,0,h*0.25);
  const bw=Math.sqrt(s.A)*w*0.03+14,bx=gx+gw/2;
  ctx.fillStyle='#c9b48a';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(bx-bw/2,gy);ctx.lineTo(bx-bw/2,gy+depth);ctx.lineTo(bx+bw/2,gy+depth);ctx.lineTo(bx+bw/2,gy);ctx.lineTo(gx+gw,gy);ctx.lineTo(gx+gw,h*0.95);ctx.lineTo(gx,h*0.95);ctx.closePath();ctx.fill();
  const bh=h*0.22;U.rect(ctx,bx-bw/2,gy+depth-bh,bw,bh,C.gold,'#fff',1);
  U.arrow(ctx,bx,gy+depth-bh-10-s.F*0.4,bx,gy+depth-bh-4,C.red,3,9);U.text(ctx,'F = '+s.F+' N',bx+16,gy+depth-bh-14-s.F*0.2,C.red,13,'left','700');
  U.text(ctx,'A = '+s.A+' cm²',bx,gy+depth-bh/2,'#222',12,'center','700');
  if(depth>2){U.line(ctx,gx+gw+6,gy,gx+gw+6,gy+depth,C.yellow,1.5);U.text(ctx,'壓痕',gx+gw+12,gy+depth/2,C.yellow,11,'left');}
  U.text(ctx,'沙地',gx+10,h*0.9,'#6b5a3a',12,'left');
  const tx=w*0.8;U.text(ctx,'P = F / A',tx,h*0.14,C.white,18,'center','700');
  U.text(ctx,'= '+s.F+' ÷ '+s.A,tx,h*0.28,C.white,15,'center');
  U.text(ctx,'= '+U.fmt(P,1)+' N/cm²',tx,h*0.42,C.yellow,22,'center','700');
  U.text(ctx,P>=20?'壓力很大：像圖釘尖端':P>=5?'壓力中等':'壓力很小：像雪鞋',tx,h*0.58,C.dim,12,'center');
  U.text(ctx,'力一樣，面積小 → 壓力大',tx,h*0.78,C.teal,12,'center');
  U.text(ctx,'面積一樣，力大 → 壓力大',tx,h*0.86,C.teal,12,'center');
 }});

Engine.sim('8b_liquidp',{title:'液體壓力 P = h·d',note:'越深壓力越大，所以下面的洞噴得最遠；換密度大的液體，同一深度壓力也變大。',
 params:[{key:'h',label:'深度 h',min:0,max:30,step:1,value:15,unit:'cm'},{key:'d',label:'液體密度 d',min:0.8,max:1.5,step:0.1,value:1,unit:'g/cm³'}],
 draw:(ctx,w,h,s,t)=>{
  const P=s.h*s.d;const bx=w*0.12,bw=w*0.22,by=h*0.1,bh=h*0.75;const pxcm=bh/30;
  const lc=`rgba(88,196,221,${0.15+(s.d-0.8)*0.6})`;
  ctx.fillStyle=lc;ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by);ctx.stroke();
  U.line(ctx,bx-4,by+bh,w*0.6,by+bh,C.grey,2);
  [10,20,30].forEach(dep=>{const hy=by+(dep-1)*pxcm;U.rect(ctx,bx+bw-2,hy-3,5,6,C.bg);const v0=Math.sqrt(dep)*w*0.055;ctx.strokeStyle=C.blue;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(bx+bw+2,hy);for(let k=0;k<=30;k++){const tt=k/30*1.2;const xx=bx+bw+2+v0*tt,yy=hy+0.5*w*0.16*tt*tt*(30/(by+bh-hy)*pxcm)*(s.d>0?1:1);if(yy>by+bh)break;ctx.lineTo(xx,yy);}ctx.stroke();U.text(ctx,dep+' cm',bx-6,hy,C.grey,10,'right');});
  const hy=by+s.h*pxcm;U.line(ctx,bx,hy,bx+bw,hy,C.yellow,1.5,[4,3]);U.circle(ctx,bx+bw/2,hy,6,C.yellow);
  U.arrow(ctx,bx+bw/2,by-6,bx+bw/2,hy-8,C.yellow,1.5,6);U.text(ctx,'h = '+s.h+' cm',bx+bw/2+8,(by+hy)/2,C.yellow,12,'left');
  const tx=w*0.78;U.text(ctx,'液體壓力',tx,h*0.12,C.dim,13,'center');
  U.text(ctx,'P = h × d',tx,h*0.24,C.white,18,'center','700');
  U.text(ctx,'= '+s.h+' × '+U.fmt(s.d,1),tx,h*0.36,C.white,15,'center');
  U.text(ctx,'= '+U.fmt(P,1)+' gw/cm²',tx,h*0.5,C.yellow,22,'center','700');
  U.text(ctx,'越深 → 壓力越大 → 噴越遠',tx,h*0.68,C.blue,12,'center');
  U.text(ctx,'密度越大 → 同深度壓力越大',tx,h*0.78,C.blue,12,'center');
  U.text(ctx,'同一深度，各方向壓力相等',tx,h*0.88,C.dim,11,'center');
 }});

Engine.sim('8b_buoy',{title:'阿基米德原理：浮力＝排開的液體重',note:'把石塊慢慢放進水裡，看溢出多少水、彈簧秤讀數少多少——兩者剛好一樣。',
 params:[{key:'V',label:'石塊體積',min:20,max:100,step:10,value:50,unit:'cm³'},{key:'f',label:'沒入比例',min:0,max:100,step:5,value:50,unit:'%'},{key:'d',label:'液體密度',min:0.8,max:1.3,step:0.1,value:1,unit:'g/cm³'}],
 draw:(ctx,w,h,s)=>{

  ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by+bh*0.2);ctx.lineTo(bx+bw+16,by+bh*0.2);ctx.stroke();
  const cx=bx+bw+30,cw=w*0.1,ch=h*0.3,cy=by+bh-ch;const lvl=Vs/100*0.9;ctx.fillStyle=lc;ctx.fillRect(cx,cy+ch*(1-lvl),cw,ch*lvl);ctx.strokeStyle=C.white;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+ch);ctx.lineTo(cx+cw,cy+ch);ctx.lineTo(cx+cw,cy);ctx.stroke();

  const sx=ox,st=h*0.04;U.rect(ctx,sx-22,st,44,h*0.14,'#2a2f3a',C.grey,1);U.text(ctx,U.fmt(R,0),sx,st+h*0.05,C.green,14,'center','700');U.text(ctx,'gw',sx,st+h*0.1,C.dim,10,'center');
  ctx.strokeStyle=C.grey;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,st+h*0.14);const L=oy-(st+h*0.14);for(let k=0;k<=12;k++)ctx.lineTo(sx+(k%2?8:-8)*(k===0||k===12?0:1),st+h*0.14+L*k/12);ctx.stroke();
  const tx=w*0.78;U.text(ctx,'重量 W = '+U.fmt(W,0)+' gw',tx,h*0.12,C.white,13,'center');
  U.text(ctx,'排開液體 = '+U.fmt(Vs,0)+' cm³',tx,h*0.26,C.blue,13,'center');
  U.text(ctx,'浮力 B = '+U.fmt(Vs,0)+' × '+U.fmt(s.d,1),tx,h*0.4,C.white,13,'center');
  U.text(ctx,'= '+U.fmt(B,1)+' gw',tx,h*0.52,C.yellow,20,'center','700');
  U.text(ctx,'彈簧秤讀數 = W − B',tx,h*0.68,C.white,13,'center');
  U.text(ctx,'= '+U.fmt(R,1)+' gw',tx,h*0.8,C.green,18,'center','700');
  U.text(ctx,'浮力 = 排開液體的重量',tx,h*0.93,C.dim,11,'center');
 }});

Engine.anim('8b_atm',{title:'大氣壓力：托里切利與馬德堡半球',note:'空氣有重量，會壓在每個方向上；1 atm 可以撐住 76 cm 高的水銀柱。',
 steps:[{caption:'托里切利：把 1 公尺長的玻璃管裝滿水銀，倒立在水銀槽裡',dur:3},{caption:'水銀往下降，降到剩 76 cm 高就停住；管子上方是真空',dur:3},{caption:'是大氣壓力把水銀柱撐住：1 atm ＝ 76 cmHg ＝ 1033.6 gw/cm²',dur:3},{caption:'馬德堡半球：兩個銅半球合起來，把裡面的空氣抽掉',dur:3},{caption:'兩邊各用八匹馬拉都拉不開——大氣壓力從四面八方把半球壓緊',dur:3.5},{caption:'大氣有壓力，約 1 atm ＝ 76 cmHg；海拔越高，大氣壓力越小',dur:3}],

(()=>{
const G=9.8;
// 小人：x,y 是腳底中心，sz 身高，lean 傾斜（弧度，正值向右傾）
const person=(ctx,x,y,sz,color,lean=0,face=1)=>{ctx.save();ctx.translate(x,y);ctx.rotate(lean);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-sz*0.55);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-sz*0.18,0);ctx.lineTo(0,-sz*0.3);ctx.lineTo(sz*0.18,0);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-sz*0.2,-sz*0.32);ctx.lineTo(0,-sz*0.5);ctx.lineTo(sz*0.22*face,-sz*0.35);ctx.stroke();
 ctx.beginPath();ctx.arc(0,-sz*0.68,sz*0.12,0,Math.PI*2);ctx.fill();ctx.restore();};
// 數值面板：右上角一行一行
const panel=(ctx,lines,x,y,size=14,gap=22)=>{lines.forEach((l,k)=>{const [s,col,wt]=Array.isArray(l)?l:[l,C.white,''];U.text(ctx,s,x,y+k*gap,col,size,'left',wt);});};

/* ===== 第1章 直線運動 ===== */
Engine.sim('9a_pendulum',{title:'單擺：什麼決定週期？',note:'改擺長、擺角、擺錘質量，看量到的週期 T 怎麼變。只有擺長會改變 T。',
 params:[{key:'L',label:'擺長 L',min:0.2,max:2,step:0.05,value:1,unit:'m'},{key:'th0',label:'擺角',min:5,max:30,step:1,value:15,unit:'°'},{key:'m',label:'擺錘質量',min:0.1,max:1,step:0.1,value:0.5,unit:'kg'}],
 buttons:[{label:'重新放開',onClick:(s,inst)=>inst.reset()}],
 init:s=>{s.th=s.th0*Math.PI/180;s.om=0;s.T=null;s.last=null;s.n=0;s.clock=0;},
 onChange:(s)=>{s.th=s.th0*Math.PI/180;s.om=0;s.T=null;s.last=null;s.n=0;s.clock=0;},
 step:(s,dt)=>{const n=20,d=dt/n;for(let k=0;k<n;k++){s.clock+=d;const pth=s.th;s.om+=-(G/s.L)*Math.sin(s.th)*d;s.th+=s.om*d;if(pth<0&&s.th>=0){if(s.last!==null){s.T=s.clock-s.last;s.n++;}s.last=s.clock;}}},
 draw:(ctx,w,h,s)=>{
  const px=w*0.32,py=h*0.1,Lp=s.L/2*h*0.72;const bx=px+Math.sin(s.th)*Lp,by=py+Math.cos(s.th)*Lp;
  U.rect(ctx,px-40,py-8,80,8,'#666');
  // 擺角範圍（虛線）
  const a0=s.th0*Math.PI/180;U.line(ctx,px,py,px+Math.sin(a0)*Lp,py+Math.cos(a0)*Lp,C.line,1,[4,4]);U.line(ctx,px,py,px-Math.sin(a0)*Lp,py+Math.cos(a0)*Lp,C.line,1,[4,4]);U.line(ctx,px,py,px,py+Lp,C.line,1,[2,4]);
  U.line(ctx,px,py,bx,by,C.grey,2);
  const r=8+s.m*12;U.glow(ctx,bx,by,r*1.8,C.gold);U.circle(ctx,bx,by,r,C.gold,'#fff',1);
  U.text(ctx,'L = '+U.fmt(s.L,2)+' m',px+Math.sin(s.th)*Lp/2+(s.th>0?-12:12),py+Math.cos(s.th)*Lp/2,C.blue,13,s.th>0?'right':'left');
  U.text(ctx,'擺角 '+s.th0+'°　質量 '+U.fmt(s.m,1)+' kg',px,h*0.95,C.dim,12,'center');
  // 數據
  const Tth=2*Math.PI*Math.sqrt(s.L/G);const tx=w*0.6;
  U.text(ctx,'週期 T（量到）',tx,h*0.14,C.white,14);
  U.text(ctx,s.T?U.fmt(s.T,2)+' s':'量測中…',tx,h*0.26,s.T?C.yellow:C.dim,26,'left','700');
  U.text(ctx,'已擺 '+s.n+' 次',tx+w*0.22,h*0.27,C.dim,12);
  panel(ctx,[['理論值 2π√(L/g) = '+U.fmt(Tth,2)+' s',C.grey],['√L = '+U.fmt(Math.sqrt(s.L),2)+'　T ÷ √L ≈ '+U.fmt(Tth/Math.sqrt(s.L),2)+'（固定）',C.teal]],tx,h*0.42,13);
  panel(ctx,[['T 與 √L 成正比',C.yellow,'700'],['T 與質量無關',C.white],['T 與擺角無關（小角度）',C.white]],tx,h*0.64,14,24);
 }});

Engine.sim('9a_disp',{title:'路徑長 vs 位移',note:'拖動 B、C 兩點：小人從 A 走到 B 再走到 C。路徑長是走過的總長，位移只看起點到終點。',
 init:s=>{s.B=6;s.Cc=2;s.drag=null;s.t=0;},
 step:(s,dt)=>{s.t=(s.t+dt*0.25)%1;},
 pointer:(s,ev)=>{const X=v=>ev.w*0.08+(v+2)/12*ev.w*0.84;if(ev.type==='down'){s.drag=Math.abs(ev.x-X(s.B))<Math.abs(ev.x-X(s.Cc))?'B':'C';}if(ev.type==='up'){s.drag=null;return;}if(!s.drag)return;const v=U.clamp(Math.round((ev.x-ev.w*0.08)/(ev.w*0.84)*12-2),-2,10);s[s.drag]=v;},

Engine.sim('9a_energy',{title:'雲霄飛車：動能＋位能＝定值',note:'拉起始高度，球從靜止滑下。位能變動能、動能再變回位能，長條總高度一直不變。翻不過比起點高的山丘！',

 buttons:[{label:'重新放開',onClick:s=>{s.reset=true;}}],

 onChange:s=>{s.reset=true;},
 step:(s,dt)=>{
  const f=x=>x<0.5?5+5*Math.cos(2*Math.PI*x):x<1?3-3*Math.cos(2*Math.PI*(x-0.5)):10*(x-1)*(x-1)*40;

  panel(ctx,[['h = '+U.fmt(y,1)+' m　v = '+U.fmt(s.v,1)+' m/s',C.white],['位能 mgh = '+U.fmt(PE,0)+' J　動能 ½mv² = '+U.fmt(KE,0)+' J',C.grey]],w*0.05,h*0.06,12,20);
  U.text(ctx,'力學能守恆：位能 + 動能 = '+U.fmt(E,0)+' J（不變）',w*0.36,h*0.95,C.yellow,13,'center','700');

Engine.sim('9a_torque',{title:'翹翹板：力 × 力臂',note:'調左邊砝碼與力臂、右邊砝碼；右邊砝碼可用手拖動改變力臂。兩邊「力 × 力臂」相等時翹翹板才水平。',
 params:[{key:'W1',label:'左砝碼重',min:10,max:100,step:10,value:40,unit:'N'},{key:'d1',label:'左力臂',min:5,max:50,step:5,value:20,unit:'cm'},{key:'W2',label:'右砝碼重',min:10,max:100,step:10,value:20,unit:'N'}],

 draw:(ctx,w,h,s)=>{

  }else if(s.k===1){

   const hy=top+40+q*h*0.44;U.arrow(ctx,cx+16,hy,cx+16,hy+30,C.red,3,9);U.text(ctx,'F = 50 N',cx+30,hy+15,C.red,12,'left');U.text(ctx,'拉繩 4 m',cx+30,hy+32,C.blue,11,'left');
   U.line(ctx,cx-30,my+14,cx-30,my+26,C.grey,2);U.rect(ctx,cx-48,my+26,36,30,C.gold,'#fff',1);U.text(ctx,'100N',cx-30,my+41,'#222',10,'center','700');U.text(ctx,'上升 2 m',cx-30-22,my+41,C.dim,11,'right');

   const bx=w*0.08,by=h*0.8,len=h*0.6/Math.sin(Math.max(th,0.3));const Lp=Math.min(len,w*0.5);const Hp=Lp*Math.sin(th),Wp=Lp*Math.cos(th);

   U.text(ctx,'高 2 m',bx+Wp+8,by-Hp/2,C.dim,11,'left');U.text(ctx,'斜面長 '+U.fmt(d,1)+' m',bx+Wp/2-14*Math.sin(th),by-Hp/2-16*Math.cos(th)-6,C.dim,11,'center');U.text(ctx,s.th+'°',bx+40,by-10,C.dim,11,'left');

Engine.anim('9a_rubcharge',{title:'摩擦起電：電子搬家',note:'毛皮摩擦塑膠尺，電子跑到塑膠尺上。',
 steps:[{caption:'摩擦前：毛皮和塑膠尺都是電中性（正電荷數 = 負電荷數）',dur:3},{caption:'用毛皮摩擦塑膠尺……',dur:2.5},{caption:'塑膠尺抓電子的能力比較強，電子從毛皮轉移到塑膠尺',dur:3.5},{caption:'塑膠尺多了電子帶負電，毛皮少了電子帶等量正電',dur:3},{caption:'兩支都帶負電的塑膠尺靠近：同性相斥；塑膠尺靠近毛皮：異性相吸',dur:4},{caption:'結論：摩擦起電是電子轉移，得電子者帶負電、失電子者帶正電，電量相等',dur:3.5}],
 draw:(ctx,w,h,i,p,t)=>{

   const pl=charges.pl,mn=charges.mn;for(let k=0;k<pl;k++)U.text(ctx,'+',x-70+k*20,y-2,C.red,15,'center','700');for(let k=0;k<mn;k++)U.text(ctx,'−',x-70+k*20,y+9,C.blue,14,'center','700');};

   if(i===1)U.text(ctx,'摩擦中…',w*0.6,h*0.5,C.dim,14,'left');
   if(i>=3){U.text(ctx,'毛皮：失去 3 個電子 → 帶正電 +3',w*0.6,fy,C.red,13,'left','700');U.text(ctx,'塑膠尺：得到 3 個電子 → 帶負電 −3',w*0.6,ry,C.blue,13,'left','700');}
