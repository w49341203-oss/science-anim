Engine.sim('9a_coulomb',{title:'庫侖定律：F ∝ q₁q₂ / r²',note:'調兩個電荷的電量（可正可負）和距離。紅色箭頭是靜電力，小箭頭是電場方向；兩電荷受力一樣大。',
 params:[{key:'q1',label:'電荷 q₁',min:-5,max:5,step:1,value:3,unit:'單位'},{key:'q2',label:'電荷 q₂',min:-5,max:5,step:1,value:-2,unit:'單位'},{key:'r',label:'距離 r',min:1,max:5,step:0.5,value:2.5,unit:'單位'}],
 draw:(ctx,w,h,s)=>{
  const cy=h*0.5,D=s.r/5*w*0.62;const x1=w/2-D/2,x2=w/2+D/2;const F=s.q1*s.q2/(s.r*s.r);
  // 電場箭頭
  const step=Math.max(26,w/24);const chs=[{x:x1,q:s.q1},{x:x2,q:s.q2}];
  for(let gx=step/2;gx<w;gx+=step)for(let gy=step/2;gy<h*0.86;gy+=step){let ex=0,ey=0,near=false;chs.forEach(c=>{const dx=gx-c.x,dy=gy-cy,d2=dx*dx+dy*dy,d=Math.sqrt(d2);if(d<24)near=true;ex+=c.q*dx/(d2*d);ey+=c.q*dy/(d2*d);});if(near)continue;const m=Math.hypot(ex,ey);if(m<1e-9)continue;const mag=U.clamp(m*6e4,0,1);const L=5+mag*11;ctx.globalAlpha=0.25+0.6*mag;U.arrow(ctx,gx-ex/m*L/2,gy-ey/m*L/2,gx+ex/m*L/2,gy+ey/m*L/2,C.teal,1.5,5);ctx.globalAlpha=1;}
  const drawQ=(x,q)=>{const r=10+Math.abs(q)*2.5;const col=q>0?C.red:q<0?C.blue:C.grey;U.glow(ctx,x,cy,r*1.8,col);U.circle(ctx,x,cy,r,col,'#fff',1);U.text(ctx,q>0?'+':q<0?'−':'0',x,cy,'#fff',16,'center','700');};
  drawQ(x1,s.q1);drawQ(x2,s.q2);
  U.text(ctx,'q₁ = '+(s.q1>0?'+':'')+s.q1,x1,cy-36,s.q1>0?C.red:s.q1<0?C.blue:C.grey,13,'center','700');U.text(ctx,'q₂ = '+(s.q2>0?'+':'')+s.q2,x2,cy-36,s.q2>0?C.red:s.q2<0?C.blue:C.grey,13,'center','700');
  U.line(ctx,x1,cy+34,x2,cy+34,C.dim,1,[4,4]);U.text(ctx,'r = '+U.fmt(s.r,1),w/2,cy+46,C.dim,12,'center');
  if(F!==0){const r1=10+Math.abs(s.q1)*2.5,r2=10+Math.abs(s.q2)*2.5;let L=10+12*Math.sqrt(Math.abs(F));
   if(F>0){L=Math.min(L,w/2-D/2-r1-6);U.arrow(ctx,x1-r1,cy,x1-r1-L,cy,C.gold,3.5,10);U.arrow(ctx,x2+r2,cy,x2+r2+L,cy,C.gold,3.5,10);}
   else{L=Math.min(L,D/2-Math.max(r1,r2)-6);U.arrow(ctx,x1+r1,cy,x1+r1+L,cy,C.gold,3.5,10);U.arrow(ctx,x2-r2,cy,x2-r2-L,cy,C.gold,3.5,10);}}
  const rel=F>0?'同性 → 相斥':F<0?'異性 → 相吸':'有一個電荷為 0 → 沒有靜電力';
  panel(ctx,[['F = k · q₁ q₂ / r²',C.white,'700'],['相對大小 = |'+s.q1+' × '+s.q2+'| / '+U.fmt(s.r,1)+'² = '+U.fmt(Math.abs(F),2),C.gold,'700'],[rel,F>0?C.red:F<0?C.green:C.grey,'700']],w*0.05,h*0.1,14,24);
  U.text(ctx,'距離變一半 → 力變 4 倍；兩電荷受力永遠一樣大',w/2,h*0.94,C.dim,12,'center');
 }});

Engine.anim('9a_induction',{title:'感應起電：不碰到也能帶電',note:'帶電體靠近金屬球，金屬裡的電子會移動；接地後再移開，金屬球就帶電了。',
 steps:[{caption:'金屬球原本電中性，正負電荷均勻分布',dur:2.5},{caption:'帶負電的棒子靠近：金屬裡的電子被排斥，跑到遠端',dur:3.5},{caption:'近端剩下正電、遠端聚集負電——這叫「靜電感應」，球整體還是中性',dur:3},{caption:'用手指（接地）碰球的遠端：被排斥的電子經由人體流到大地',dur:3.5},{caption:'先移開手指、再移開棒子：電子回不來了',dur:3},{caption:'結論：感應起電後，金屬球帶的電與帶電體相反（棒帶負 → 球帶正）',dur:3.5}],
 draw:(ctx,w,h,i,p)=>{
  const cx=w*0.55,cy=h*0.5,R=Math.min(h*0.24,w*0.14);
  // 棒子
  const rodX=i===0?w*0.05:i===1?U.lerp(w*0.05,cx-R-70,p):i<=3?cx-R-70:i===4?U.lerp(cx-R-70,w*0.05,U.clamp((p-0.5)*2,0,1)):w*0.05;
  U.rect(ctx,rodX-120,cy-12,150,24,'#444',C.grey,1);for(let k=0;k<6;k++)U.text(ctx,'−',rodX-105+k*24,cy,C.blue,16,'center','700');U.text(ctx,'帶負電的棒',rodX-45,cy-24,C.blue,12,'center');
  // 球
  U.circle(ctx,cx,cy,R,'#3a4050',C.grey,2);U.line(ctx,cx,cy+R,cx,cy+R+30,'#666',4);U.rect(ctx,cx-30,cy+R+30,60,8,'#666');U.text(ctx,'金屬球（絕緣座）',cx,cy+R+52,C.dim,11,'center');
  // 電荷分布
  const sep=i===0?0:i===1?p:1;const gone=i===3?p:i>=4?1:0;
  const n=6;for(let k=0;k<n;k++){const a=(k/n)*Math.PI*2;const bx=cx+Math.cos(a)*R*0.55,by=cy+Math.sin(a)*R*0.55;
   // 正電固定，負電移動到遠端（右側）
   U.text(ctx,'+',bx,by-8,C.red,15,'center','700');
   const tx=cx+R*0.75,ty=cy+(k-(n-1)/2)*R*0.26;const ex=U.lerp(bx,tx,sep),ey=U.lerp(by+8,ty,sep);
   if(gone>0&&k<4){const gx=U.lerp(tx,cx+R+50,Math.min(1,gone*1.5)),gy=U.lerp(ty,cy-R-40,Math.min(1,gone*1.5));if(gone<1)U.text(ctx,'−',gx,gy,C.blue,15,'center','700');continue;}
   U.text(ctx,'−',ex,ey,C.blue,15,'center','700');}
  if(i>=1&&i<=3){U.text(ctx,'近端 +',cx-R-8,cy-R-10,C.red,13,'right','700');U.text(ctx,'遠端 −',cx+R+8,cy-R-10,C.blue,13,'left','700');}
  // 手指接地
  if(i===3||(i===4&&p<0.5)){const fq=i===3?1:1-p*2;const fx=cx+R+50-U.clamp(1-fq,0,1)*60;ctx.fillStyle='#e0b090';ctx.beginPath();ctx.ellipse(fx+40,cy-R-40,42,14,0,0,Math.PI*2);ctx.fill();U.text(ctx,'手指（接地）',fx+40,cy-R-64,C.white,12,'center');if(i===3)U.text(ctx,'電子流走 →',cx+R+20,cy-R-8,C.blue,12,'left');}
  if(i===5){U.text(ctx,'球帶正電',cx,cy-R-24,C.red,15,'center','700');U.rect(ctx,w*0.05,h*0.84,w*0.9,h*0.12,'#0b0f19ee',C.yellow,1);U.text(ctx,'感應起電：接地時遠端的同性電流走，球帶上與帶電體相反的電',w/2,h*0.9,C.yellow,13,'center','700');}

Engine.anim('9a_current',{title:'電流是什麼？I = Q / t',note:'看電子怎麼在電路裡跑，以及「電流方向」為什麼跟電子相反。',

Engine.sim('9a_ohm',{title:'歐姆定律：I = V / R',note:'拉電壓和電阻，看電流和燈泡亮度怎麼變。V–I 圖是通過原點的直線，斜率就是電阻 R。',
 params:[{key:'V',label:'電壓 V',min:0,max:12,step:0.5,value:6,unit:'V'},{key:'R',label:'電阻 R',min:1,max:12,step:0.5,value:3,unit:'Ω'}],
 draw:(ctx,w,h,s,t)=>{
  const I=s.V/s.R;const L=w*0.06,R=w*0.46,T=h*0.18,B=h*0.84;ctx.strokeStyle=C.grey;ctx.lineWidth=3;ctx.strokeRect(L,T,R-L,B-T);
  const bx=(L+R)/2;U.rect(ctx,bx-30,B-12,60,24,C.bg);U.line(ctx,bx-8,B-18,bx-8,B+18,C.white,4);U.line(ctx,bx+8,B-10,bx+8,B+10,C.white,2);U.text(ctx,U.fmt(s.V,1)+' V',bx,B+26,C.white,13,'center','700');
  // 電阻（右邊）
  U.rect(ctx,R-14,h*0.42,28,h*0.18,C.bg);ctx.save();ctx.strokeStyle=C.gold;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(R,h*0.42);for(let k=0;k<7;k++)ctx.lineTo(R+(k%2?-10:10),h*0.42+(k+0.5)*h*0.18/7);ctx.lineTo(R,h*0.6);ctx.stroke();ctx.restore();U.text(ctx,U.fmt(s.R,1)+' Ω',R+18,h*0.51,C.gold,13,'left','700');

  const br=U.clamp(I/6,0,1);U.rect(ctx,bx-22,T-16,44,32,C.bg);if(br>0)U.glow(ctx,bx,T,16+br*36,C.yellow);U.circle(ctx,bx,T,14,`rgba(255,255,${Math.round(255-br*140)},${0.25+br*0.75})`,C.white,2);
  // 電流粒子
  const per=(R-L)*2+(B-T)*2;const n=12;for(let k=0;k<n;k++){let d=((t*50*I+k*per/n)%per);let x,y;if(d<B-T){x=L;y=B-d;}else if(d<B-T+R-L){x=L+(d-(B-T));y=T;}else if(d<2*(B-T)+R-L){x=R;y=T+(d-(B-T)-(R-L));}else{x=R-(d-2*(B-T)-(R-L));y=B;}if(y===B&&Math.abs(x-bx)<30)continue;if(y===T&&Math.abs(x-bx)<16)continue;if(x===R&&y>h*0.42&&y<h*0.6)continue;if(I>0)U.circle(ctx,x,y,3.5,C.red);}
  U.text(ctx,'I = '+U.fmt(I,2)+' A',L+16,h*0.5,C.red,14,'left','700');
  // V–I 圖
  const ax=U.axes(ctx,w*0.62,h*0.84,w*0.3,h*0.6,{xl:'I (A)',yl:'V (V)',xmax:6,ymax:12});
  for(let q=0;q<=6;q+=2)U.text(ctx,String(q),ax.x(q),ax.y0+11,C.dim,10,'center');for(let q=0;q<=12;q+=4)U.text(ctx,String(q),ax.x0-5,ax.y(q),C.dim,10,'right');
  const imax=Math.min(6,12/s.R);U.line(ctx,ax.x(0),ax.y(0),ax.x(imax),ax.y(imax*s.R),C.blue,2.5);
  U.glow(ctx,ax.x(Math.min(I,6)),ax.y(s.V),12,C.yellow);U.circle(ctx,ax.x(Math.min(I,6)),ax.y(s.V),4,C.white);

  U.text(ctx,'I = V / R = '+U.fmt(s.V,1)+' / '+U.fmt(s.R,1)+' = '+U.fmt(I,2)+' A',w*0.77,h*0.94,C.yellow,13,'center','700');
 }});

Engine.sim('9a_series',{title:'串聯與並聯',note:'電池 12 V 固定。切換接法、拉 R₁ R₂，看總電阻、各處電流與電壓怎麼分配。',

   U.text(ctx,'I = '+U.fmt(It,2)+' A',L+14,h*0.5,C.red,13,'left','700');U.text(ctx,'V₁ = '+U.fmt(V1,1)+' V',L+seg*1.1,T+28,C.blue,12,'center');U.text(ctx,'V₂ = '+U.fmt(V2,1)+' V',R-seg*1.1,T+28,C.gold,12,'center');}
  else{const m1=L+(R-L)*0.3,m2=L+(R-L)*0.7,Ty=T+h*0.14,By=B-h*0.18;U.line(ctx,m1,T,m1,B,C.grey,3);U.line(ctx,m2,T,m2,B,C.grey,3);const len=h*0.22;
   U.rect(ctx,m1-12,(Ty+By)/2-len/2,24,len,C.bg);res(m1,(Ty+By)/2-len/2,len,true,'R₁ '+s.R1+' Ω',C.blue);U.rect(ctx,m2-12,(Ty+By)/2-len/2,24,len,C.bg);res(m2,(Ty+By)/2-len/2,len,true,'R₂ '+s.R2+' Ω',C.gold);
   U.text(ctx,'I₁ = '+U.fmt(I1,2)+' A',m1-14,T+30,C.blue,11,'right');U.text(ctx,'I₂ = '+U.fmt(I2,2)+' A',m2-14,T+30,C.gold,11,'right');U.text(ctx,'總電流 '+U.fmt(It,2)+' A',L+14,B-24,C.red,12,'left','700');U.text(ctx,'兩端電壓都是 12 V',(m1+m2)/2,B-24,C.dim,11,'center');}
  // 電流粒子（外圈）
  const per=(R-L)*2+(B-T)*2;const n=14;for(let k=0;k<n;k++){let d=((t*30*It+k*per/n)%per);let x,y;if(d<B-T){x=L;y=B-d;}else if(d<B-T+R-L){x=L+(d-(B-T));y=T;}else if(d<2*(B-T)+R-L){x=R;y=T+(d-(B-T)-(R-L));}else{x=R-(d-2*(B-T)-(R-L));y=B;}if(y===B&&Math.abs(x-bx)<30)continue;if(ser&&y===T)continue;U.circle(ctx,x,y,3.5,C.red);}
  const tx=w*0.6;U.text(ctx,ser?'串聯':'並聯',tx,h*0.1,C.white,18,'left','700');
  panel(ctx,ser?[['總電阻 R = R₁ + R₂ = '+U.fmt(Rt,1)+' Ω',C.yellow,'700'],['電流 I = 12 / '+U.fmt(Rt,1)+' = '+U.fmt(It,2)+' A（處處相等）',C.red],['V₁ = I·R₁ = '+U.fmt(V1,1)+' V',C.blue],['V₂ = I·R₂ = '+U.fmt(V2,1)+' V',C.gold],['V₁ + V₂ = 12 V（電壓分配）',C.grey],['電阻大的分到的電壓多',C.teal]]:[['1/R = 1/R₁ + 1/R₂',C.grey],['總電阻 R = '+U.fmt(Rt,2)+' Ω（比 R₁、R₂ 都小）',C.yellow,'700'],['兩支路電壓都 = 12 V',C.white],['I₁ = 12 / R₁ = '+U.fmt(I1,2)+' A',C.blue],['I₂ = 12 / R₂ = '+U.fmt(I2,2)+' A',C.gold],['總電流 = I₁ + I₂ = '+U.fmt(It,2)+' A（電流分流）',C.red],['電阻小的分到的電流多',C.teal]],tx,h*0.22,12,22);
 }});

(()=>{
/* ---- 共用小工具（本檔專用）---- */
const A=(hex,a)=>hex+Math.round(U.clamp(a,0,1)*255).toString(16).padStart(2,'0');
const pathPos=(pts,u)=>{const segs=[];let L=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);L+=d;}let d=((u%1)+1)%1*L;for(let i=0;i<segs.length;i++){if(d<=segs[i]){const q=d/segs[i];return[U.lerp(pts[i][0],pts[i+1][0],q),U.lerp(pts[i][1],pts[i+1][1],q)];}d-=segs[i];}return pts[pts.length-1];};
const drawPath=(ctx,pts,color,lw=2)=>{ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();};
const dots=(ctx,pts,t,n,color,r=4,dir=1)=>{for(let k=0;k<n;k++){const [x,y]=pathPos(pts,dir*t*0.25+k/n);U.circle(ctx,x,y,r,color);}};
// 兩極模型磁場：poles=[{x,y,q}]
const Bf=(x,y,poles)=>{let bx=0,by=0;for(const p of poles){const dx=x-p.x,dy=y-p.y;const r2=dx*dx+dy*dy+1;const k=p.q/(r2*Math.sqrt(r2));bx+=k*dx;by+=k*dy;}return[bx,by];};
const trace=(x0,y0,poles,sign,bounds,stopR,maxSteps=700)=>{const pts=[[x0,y0]];let x=x0,y=y0;for(let i=0;i<maxSteps;i++){const [bx,by]=Bf(x,y,poles);const m=Math.hypot(bx,by);if(m<1e-12)break;x+=sign*bx/m*3;y+=sign*by/m*3;pts.push([x,y]);if(x<bounds[0]||x>bounds[2]||y<bounds[1]||y>bounds[3])break;if(poles.some(p=>p.q*sign<0&&Math.hypot(x-p.x,y-p.y)<stopR))break;}return pts;};
const fieldLine=(ctx,pts,color,lw=1.5,arrowEvery=22)=>{drawPath(ctx,pts,color,lw);for(let k=arrowEvery;k<pts.length-2;k+=arrowEvery){const a=pts[k-1],b=pts[k];U.arrow(ctx,a[0],a[1],b[0],b[1],color,lw,7);}};
const compass=(ctx,x,y,r,ang,label)=>{U.circle(ctx,x,y,r,'#ffffff18',C.grey,1.5);const dx=Math.cos(ang)*r*0.8,dy=Math.sin(ang)*r*0.8;ctx.save();ctx.fillStyle=C.red;ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x-dy*0.18,y+dx*0.18);ctx.lineTo(x+dy*0.18,y-dx*0.18);ctx.closePath();ctx.fill();ctx.fillStyle=C.white;ctx.beginPath();ctx.moveTo(x-dx,y-dy);ctx.lineTo(x-dy*0.18,y+dx*0.18);ctx.lineTo(x+dy*0.18,y-dx*0.18);ctx.closePath();ctx.fill();ctx.restore();U.circle(ctx,x,y,2.5,C.grey);if(label)U.text(ctx,label,x,y+r+11,C.dim,11,'center');};
const battery=(ctx,x,y,len=30)=>{U.line(ctx,x-len/2,y,x-6,y,C.grey,2);U.line(ctx,x-6,y-14,x-6,y+14,C.white,3);U.line(ctx,x+6,y-7,x+6,y+7,C.white,3);U.line(ctx,x+6,y,x+len/2,y,C.grey,2);U.text(ctx,'−',x-6,y-22,C.blue,13,'center','700');U.text(ctx,'+',x+6,y-22,C.red,13,'center','700');};
const bulb=(ctx,x,y,r,br)=>{if(br>0.02){ctx.save();ctx.globalAlpha=U.clamp(br,0,1);U.glow(ctx,x,y,r*(1.6+br*1.6),C.yellow);ctx.restore();}U.circle(ctx,x,y,r,`rgba(255,245,170,${0.15+0.75*br})`,C.grey,1.5);U.rect(ctx,x-r*0.45,y+r*0.85,r*0.9,r*0.5,'#888');ctx.save();ctx.strokeStyle=br>0.05?C.gold:C.dim;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-r*0.4,y+r*0.7);ctx.lineTo(x-r*0.25,y-r*0.2);ctx.lineTo(x,y+r*0.2);ctx.lineTo(x+r*0.25,y-r*0.2);ctx.lineTo(x+r*0.4,y+r*0.7);ctx.stroke();ctx.restore();};
const beaker=(ctx,x,y,bw,bh,lvl,color)=>{ctx.fillStyle=color;ctx.fillRect(x,y+bh*(1-lvl),bw,bh*lvl);ctx.strokeStyle=C.white;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+bh);ctx.lineTo(x+bw,y+bh);ctx.lineTo(x+bw,y);ctx.stroke();};
const magnetBar=(ctx,x,y,L,H,nRight=true,ang=0)=>{ctx.save();ctx.translate(x,y);ctx.rotate(ang);U.rect(ctx,-L/2,-H/2,L/2,H,nRight?C.blue:C.red);U.rect(ctx,0,-H/2,L/2,H,nRight?C.red:C.blue);U.rect(ctx,-L/2,-H/2,L,H,null,C.white,1.5);U.text(ctx,nRight?'S':'N',-L/4,0,'#111',Math.min(H*0.7,18),'center','700');U.text(ctx,nRight?'N':'S',L/4,0,'#111',Math.min(H*0.7,18),'center','700');ctx.restore();};

/* ===== 第1章 電流的熱效應與化學效應 ===== */
Engine.sim('9b_power',{title:'電功率與電能：燈泡多亮、電表轉多快',note:'拉電壓與電流，燈泡亮度和電表轉速跟著變；P = I × V，再乘上使用時間就是用掉的電能 E = P × t。',
 params:[{key:'V',label:'電壓 V',min:10,max:110,step:10,value:110,unit:'V'},{key:'I',label:'電流 I',min:0.1,max:10,step:0.1,value:1,unit:'A'},{key:'t',label:'使用時間 t',min:0.5,max:10,step:0.5,value:2,unit:'h'}],
 init:s=>{s.ang=0;},
 step:(s,dt)=>{s.ang+=(s.I*s.V/120+0.2)*dt;},
 draw:(ctx,w,h,s)=>{
  const P=s.I*s.V,E=P*s.t,br=U.clamp(P/1100,0,1);
  const r=Math.min(w,h)*0.085;
  // 燈泡
  const bx=w*0.2,by=h*0.42;
  bulb(ctx,bx,by,r,br);
  U.text(ctx,'燈泡',bx,by-r-18,C.white,14,'center','700');
  U.text(ctx,'P = '+U.fmt(P,0)+' W',bx,by+r+34,C.yellow,15,'center','700');
  U.text(ctx,br>0.7?'很亮':br>0.25?'普通亮':'微亮',bx,by+r+54,C.dim,12,'center');
  // 電表
  const mx=w*0.5,my=h*0.42,mr=r*1.25;
  U.circle(ctx,mx,my,mr,'#1a2236',C.grey,2);
  U.circle(ctx,mx,my,mr*0.6,'#2a3247',C.dim,1);
  const a=s.ang;U.line(ctx,mx,my,mx+Math.cos(a)*mr*0.55,my+Math.sin(a)*mr*0.55,C.red,3);
  for(let k=0;k<12;k++){const q=k/12*Math.PI*2;U.line(ctx,mx+Math.cos(q)*mr*0.85,my+Math.sin(q)*mr*0.85,mx+Math.cos(q)*mr*0.95,my+Math.sin(q)*mr*0.95,C.grey,1);}
  U.text(ctx,'電表',mx,my-mr-18,C.white,14,'center','700');
  U.text(ctx,'轉得越快，用電越快',mx,my+mr+16,C.dim,12,'center');
  // 累積度數（示意）
  U.rect(ctx,mx-46,my+mr+26,92,22,'#0b0f19',C.grey,1);
  U.text(ctx,U.fmt(E/1000,2)+' 度',mx,my+mr+37,C.green,14,'center','700');
  // 公式
  const tx=w*0.8;
  U.text(ctx,'電功率',tx,h*0.14,C.white,14,'center');
  U.text(ctx,'P = I × V',tx,h*0.24,C.white,16,'center','700');
  U.text(ctx,'= '+U.fmt(s.I,1)+' × '+U.fmt(s.V,0)+' = '+U.fmt(P,0)+' W',tx,h*0.34,C.yellow,14,'center');
  U.text(ctx,'電能',tx,h*0.5,C.white,14,'center');
  U.text(ctx,'E = P × t',tx,h*0.6,C.white,16,'center','700');
  U.text(ctx,'= '+U.fmt(P,0)+' W × '+U.fmt(s.t,1)+' h',tx,h*0.7,C.yellow,14,'center');
  U.text(ctx,'= '+U.fmt(E,0)+' Wh = '+U.fmt(E/1000,2)+' 度',tx,h*0.8,C.green,15,'center','700');
  U.text(ctx,'1 度 = 1 kWh = 1000 W 的電器用 1 小時',w/2,h*0.95,C.dim,12,'center');
 }});

Engine.anim('9b_battery',{title:'鋅銅電池：化學能變電能',note:'看鋅片怎麼溶解、電子往哪裡跑、燈泡為什麼會亮。',
 steps:[{caption:'鋅片和銅片插入硫酸銅水溶液，用導線接上燈泡',dur:2.5},{caption:'鋅比較活潑：鋅原子失去電子變成 Zn²⁺ 溶進溶液，鋅片慢慢變薄',dur:3.5},{caption:'留在鋅片上的電子經過導線流向銅片，燈泡亮了（電流方向與電子相反）',dur:3.5},{caption:'溶液裡的 Cu²⁺ 在銅片得到電子，變成銅附在銅片上',dur:3},{caption:'失去電子的鋅片是負極，得到電子的銅片是正極：化學能 → 電能',dur:3}],
 draw:(ctx,w,h,i,p,t)=>{
  const bx=w*0.3,bw=w*0.4,by=h*0.36,bh=h*0.55,surf=by+bh*0.25;
  beaker(ctx,bx,by,bw,bh,0.75,'#58C4DD30');
  U.text(ctx,'硫酸銅水溶液',bx+bw/2,by+bh-14,C.blue,12,'center');
  const zx=bx+bw*0.22,cx=bx+bw*0.78,ptop=by-h*0.06,pbot=by+bh-h*0.08;
  // 鋅片（變薄）
  const thin=i<1?0:i===1?p:1;const zw=16-6*thin;
  U.rect(ctx,zx-zw/2,ptop,zw,pbot-ptop,'#b9bfc7');U.text(ctx,'鋅片 Zn',zx,pbot+14,C.white,12,'center');
  // 銅片 + 析出
  U.rect(ctx,cx-8,ptop,16,pbot-ptop,'#d98b4a');
  const dep=i<3?0:i===3?p:1;if(dep>0){U.rect(ctx,cx-8-4*dep,surf+10,4*dep,pbot-surf-10,'#b5651d');U.rect(ctx,cx+8,surf+10,4*dep,pbot-surf-10,'#b5651d');}
  U.text(ctx,'銅片 Cu',cx,pbot+14,C.white,12,'center');
  // 導線 + 燈泡
  const wy=h*0.13;const wire=[[zx,ptop],[zx,wy],[cx,wy],[cx,ptop]];
  drawPath(ctx,wire,C.grey,2.5);
  bulb(ctx,w/2,wy,14,i>=2?1:0);
  // 電子流動
  if(i>=2){const q=i===2?p:1;ctx.save();ctx.globalAlpha=q;dots(ctx,wire,t,10,C.yellow,3.5);ctx.restore();U.text(ctx,'電子 e⁻ →',w*0.36,wy-16,C.yellow,12,'center');U.arrow(ctx,w*0.66,wy-16,w*0.56,wy-16,C.teal,2,7);U.text(ctx,'電流方向',w*0.72,wy-16,C.teal,12,'left');}
  // Zn2+ 離子溶出
  if(i>=1){const q=i===1?p:1;for(let k=0;k<7;k++){const ph=(t*0.35+k*0.17)%1;if(ph>q)continue;const y=surf+20+(k*37)%(pbot-surf-40);const x=zx+8+ph*bw*0.28;U.circle(ctx,x,y,5,C.grey);U.text(ctx,'Zn²⁺',x,y-10,C.grey,9,'center');}}
  // Cu2+ 離子往銅片
  if(i>=3){for(let k=0;k<5;k++){const ph=(t*0.3+k*0.2)%1;const y=surf+30+(k*41)%(pbot-surf-50);const x=cx-14-(1-ph)*bw*0.25;U.circle(ctx,x,y,5,C.orange);U.text(ctx,'Cu²⁺',x,y-10,C.orange,9,'center');}}
  else if(i>=0){for(let k=0;k<5;k++){const y=surf+30+(k*41)%(pbot-surf-50);const x=bx+bw*0.45+(k*29)%(bw*0.25);U.circle(ctx,x,y,5,A(C.orange,0.6));}}
  // 說明文字
  if(i>=1){U.text(ctx,'Zn → Zn²⁺ + 2e⁻',w*0.15,h*0.45,C.grey,14,'center','700');U.text(ctx,'失去電子',w*0.15,h*0.55,C.dim,12,'center');}
  if(i>=3){U.text(ctx,'Cu²⁺ + 2e⁻ → Cu',w*0.85,h*0.45,C.orange,14,'center','700');U.text(ctx,'得到電子',w*0.85,h*0.55,C.dim,12,'center');}
  if(i>=4){U.text(ctx,'負極（−）',w*0.15,h*0.7,C.blue,16,'center','700');U.text(ctx,'正極（+）',w*0.85,h*0.7,C.red,16,'center','700');U.text(ctx,'化學能 → 電能',w/2,h*0.27,C.yellow,15,'center','700');}
 }});

Engine.sim('9b_magnet',{title:'磁場與磁力線：拖著小磁針到處看',note:'拖曳小磁針到磁鐵周圍任何位置，磁針 N 極永遠指著該處磁力線的方向：從 N 極出來、進入 S 極。',
 params:[{key:'n',label:'磁力線數量',min:6,max:18,step:2,value:12,unit:'條'}],
 init:s=>{s.px=0.5;s.py=0.2;},
 pointer:(s,ev)=>{if(ev.type==='up')return;s.px=U.clamp(ev.x/ev.w,0.03,0.97);s.py=U.clamp(ev.y/ev.h,0.05,0.95);},
 draw:(ctx,w,h,s)=>{
  const cx=w*0.5,cy=h*0.52,L=w*0.3,H=h*0.12;
  const poles=[{x:cx+L/2-12,y:cy,q:1},{x:cx-L/2+12,y:cy,q:-1}];

  magnetBar(ctx,cx,cy,L,H,true);
    // 小磁針
  const x=s.px*w,y=s.py*h;const [bx,by]=Bf(x,y,poles);const ang=Math.atan2(by,bx);

 }});

Engine.sim('9b_oersted',{title:'電流的磁效應：直導線周圍的磁場',note:'俯視一條垂直穿出畫面的導線。拉電流大小與方向，看同心圓磁力線與四個小磁針怎麼轉；離導線越近磁場越強。',
 params:[{key:'I',label:'電流 I',min:-5,max:5,step:0.5,value:3,unit:'A'},{key:'r',label:'磁針距離 r',min:2,max:7,step:0.5,value:4,unit:'cm'}],
 draw:(ctx,w,h,s)=>{
  const cx=w*0.4,cy=h*0.5,unit=Math.min(w,h)*0.055;
  const I=s.I,sgn=Math.sign(I),mag=Math.abs(I);

   for(let m=0;m<4;m++){const th=m/4*Math.PI*2+k*0.3;const x=cx+Math.cos(th)*R,y=cy+Math.sin(th)*R;const tx=Math.sin(th)*sgn,ty=-Math.cos(th)*sgn;U.arrow(ctx,x-tx*4,y-ty*4,x+tx*4,y+ty*4,A(C.teal,alpha),1.5,7);}}}
  // 導線截面
  U.circle(ctx,cx,cy,12,'#333',C.white,2);
  if(sgn>0)U.circle(ctx,cx,cy,4,C.white);else if(sgn<0){U.line(ctx,cx-6,cy-6,cx+6,cy+6,C.white,2);U.line(ctx,cx-6,cy+6,cx+6,cy-6,C.white,2);}
  // 四個磁針
  const R=s.r/8*unit*8;
  for(let m=0;m<4;m++){const th=m/2*Math.PI;const x=cx+Math.cos(th)*R,y=cy+Math.sin(th)*R;let ang;if(mag===0)ang=-Math.PI/2;else ang=Math.atan2(-Math.cos(th)*sgn,Math.sin(th)*sgn);compass(ctx,x,y,15,ang);}
  // 說明
  const tx=w*0.8;
  U.text(ctx,'電流 I = '+U.fmt(mag,1)+' A',tx,h*0.12,C.white,15,'center','700');
  U.text(ctx,mag===0?'（沒有電流）':sgn>0?'⊙ 流出畫面':'⊗ 流入畫面',tx,h*0.21,sgn>0?C.yellow:sgn<0?C.pink:C.dim,13,'center');
  U.text(ctx,mag===0?'沒有磁場，磁針指北':'磁場方向：'+(sgn>0?'逆時針':'順時針'),tx,h*0.32,C.teal,13,'center');
  U.text(ctx,'安培右手定則',tx,h*0.46,C.gold,14,'center','700');
  U.text(ctx,'大拇指：電流方向',tx,h*0.55,C.white,12,'center');

  const Bv=mag/s.r;
  U.text(ctx,'磁針處磁場強度 ∝ I ÷ r',tx,h*0.76,C.dim,12,'center');
  U.rect(ctx,tx-60,h*0.82,120,10,'#ffffff12',C.line,1);U.rect(ctx,tx-60,h*0.82,120*U.clamp(Bv/2.5,0,1),10,C.teal);
  U.text(ctx,'r = '+U.fmt(s.r,1)+' cm',tx,h*0.92,C.dim,12,'center');
  U.text(ctx,'俯視圖：導線垂直穿出畫面',cx,h*0.06,C.dim,12,'center');
 }});

Engine.sim('9b_solenoid',{title:'螺線管的磁場：像一根條形磁鐵',note:'拉電流方向與匝數，看線圈兩端哪邊是 N 極。右手四指彎向電流方向，大拇指指的那端就是 N 極。',
 params:[{key:'I',label:'電流 I',min:-3,max:3,step:0.5,value:2,unit:'A'},{key:'N',label:'匝數 N',min:2,max:20,step:1,value:8,unit:'匝'}],
 draw:(ctx,w,h,s,t)=>{

  // N/S 標籤

  U.text(ctx,'黃色箭頭 = 前面導線的電流方向',cx,h*0.08,C.dim,12,'center');
  // 右側說明

  U.text(ctx,'= '+U.fmt(NI,1),tx,h*0.5,C.teal,13,'center');

Engine.sim('9b_induction',{title:'電磁感應：磁鐵動，才有電流',note:'拖曳磁鐵進出線圈（或按「自動來回」），看檢流計指針。磁鐵停下來，指針就回到 0。',
 params:[{key:'N',label:'線圈匝數 N',min:5,max:50,step:5,value:20,unit:'匝'},{key:'spd',label:'自動來回速度',min:0.3,max:3,step:0.1,value:1,unit:'倍'}],
 buttons:[{label:'自動來回 / 停止',onClick:s=>{s.auto=!s.auto;}}],
 init:s=>{s.mx=0.15;s.auto=true;s.emf=0;s.flux=null;s.needle=0;},
 pointer:(s,ev)=>{if(ev.type==='up')return;s.auto=false;s.mx=U.clamp(ev.x/ev.w,0.06,0.72);},
 step:(s,dt,t)=>{
  if(s.auto)s.mx=0.42+0.3*Math.sin(t*s.spd*1.6);
  const d=s.mx-0.42;const flux=s.N*Math.exp(-((d/0.11)**2));
  let target=0;if(s.flux!==null&&dt>0)target=-(flux-s.flux)/dt;s.flux=flux;
  s.emf+=(target-s.emf)*Math.min(1,dt*12);
  const goal=U.clamp(s.emf/160,-1,1);s.needle+=(goal-s.needle)*Math.min(1,dt*10);
 },
 draw:(ctx,w,h,s)=>{
  const cx=w*0.42,cy=h*0.62,R=h*0.15,cw=w*0.14,n=8;
  // 線圈後半
  for(let k=0;k<n;k++){const x=cx-cw/2+(k+0.5)*cw/n;ctx.save();ctx.strokeStyle=A(C.gold,0.35);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,cy,6,R,0,Math.PI/2,Math.PI*1.5);ctx.stroke();ctx.restore();}
  // 磁鐵

const motorScene=(ctx,w,h,th,opts)=>{

};

Engine.anim('9b_generator',{title:'發電機：轉動線圈就發電',note:'用外力轉動磁場中的線圈，穿過線圈的磁力線數目一直改變，就產生感應電流；每半圈方向反轉，所以是交流電。',

 draw:(ctx,w,h,i,p,t)=>{

Engine.sim('9b_transformer',{title:'變壓器：匝數比決定電壓比',note:'拉原線圈、副線圈匝數與輸入電壓，看輸出電壓怎麼變：V₁ / V₂ = N₁ / N₂。',
 params:[{key:'N1',label:'原線圈匝數 N₁',min:100,max:1000,step:50,value:200,unit:'匝'},{key:'N2',label:'副線圈匝數 N₂',min:100,max:1000,step:50,value:400,unit:'匝'},{key:'V1',label:'輸入電壓 V₁（交流）',min:10,max:220,step:10,value:110,unit:'V'}],
 draw:(ctx,w,h,s,t)=>{
  const V2=s.V1*s.N2/s.N1;
  const ox=w*0.32,oy=h*0.2,ow=w*0.36,oh=h*0.62,th=Math.min(w*0.06,40);

  U.text(ctx,'鐵芯',w/2,oy+oh/2-14,C.grey,12,'center');
  // 磁通（交流：方向來回）
  const dir=Math.sin(t*3)>0?1:-1;const mx0=ox+th/2,mx1=ox+ow-th/2,my0=oy+th/2,my1=oy+oh-th/2;
  const loop=[[mx0,my0],[mx1,my0],[mx1,my1],[mx0,my1],[mx0,my0]];
  ctx.save();ctx.globalAlpha=0.4+0.4*Math.abs(Math.sin(t*3));drawPath(ctx,loop,C.teal,1);for(let k=0;k<8;k++){const [x,y]=pathPos(loop,dir*t*0.4+k/8);const [x2,y2]=pathPos(loop,dir*t*0.4+k/8+dir*0.01);U.arrow(ctx,x,y,x+(x2-x)*3,y+(y2-y)*3,C.teal,1.5,7);}ctx.restore();

  const coil=(xc,N,col)=>{const n=Math.round(N/50);const y0=oy+th+14,y1=oy+oh-th-14;const sp=(y1-y0)/n;for(let k=0;k<n;k++){const y=y0+(k+0.5)*sp;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(xc,y,th/2+8,Math.min(5,sp*0.42),0,0,Math.PI*2);ctx.stroke();ctx.restore();}return n;};
  coil(ox+th/2,s.N1,C.gold);coil(ox+ow-th/2,s.N2,C.orange);
  // 電源
  const sx=w*0.12,sy=h*0.5;U.circle(ctx,sx,sy,18,'#1a2236',C.white,2);U.text(ctx,'~',sx,sy,C.white,20,'center','700');
  U.line(ctx,sx,sy-18,sx,oy+th,C.grey,2);U.line(ctx,sx,oy+th,ox-th/2-8,oy+th,C.grey,2);U.line(ctx,sx,sy+18,sx,oy+oh-th,C.grey,2);U.line(ctx,sx,oy+oh-th,ox-th/2-8,oy+oh-th,C.grey,2);
  U.text(ctx,'交流電源',sx,sy+32,C.dim,11,'center');
  // 燈泡
  const lx=w*0.88,ly=h*0.5;U.line(ctx,ox+ow+th/2+8,oy+th,lx,oy+th,C.grey,2);U.line(ctx,lx,oy+th,lx,ly-16,C.grey,2);U.line(ctx,ox+ow+th/2+8,oy+oh-th,lx,oy+oh-th,C.grey,2);U.line(ctx,lx,oy+oh-th,lx,ly+18,C.grey,2);
  bulb(ctx,lx,ly,13,U.clamp(V2/300,0,1));
  // 標籤
  U.text(ctx,'原線圈',ox+th/2,oy+oh+14,C.gold,12,'center','700');U.text(ctx,'N₁ = '+s.N1,ox+th/2,oy+oh+30,C.gold,12,'center');
  U.text(ctx,'副線圈',ox+ow-th/2,oy+oh+14,C.orange,12,'center','700');U.text(ctx,'N₂ = '+s.N2,ox+ow-th/2,oy+oh+30,C.orange,12,'center');
  U.text(ctx,'V₁ = '+s.V1+' V',sx,h*0.2,C.gold,14,'center','700');
  U.text(ctx,'V₂ = '+U.fmt(V2,0)+' V',lx,h*0.2,C.orange,14,'center','700');
  // 公式
  U.text(ctx,'V₁ / V₂ = N₁ / N₂',w/2,h*0.06,C.white,15,'center','700');
  const kind=s.N2>s.N1?'升壓變壓器':s.N2<s.N1?'降壓變壓器':'匝數相同，電壓不變';
  const kc=s.N2>s.N1?C.red:s.N2<s.N1?C.blue:C.dim;U.text(ctx,s.V1+' / '+U.fmt(V2,0)+' = '+s.N1+' / '+s.N2,w/2,h*0.13,C.yellow,13,'center','700');U.text(ctx,kind,w/2,oy+oh/2+8,kc,14,'center','700');
  U.text(ctx,'只有交流電能讓鐵芯磁場不斷變化，副線圈才有感應電壓',w/2,h*0.95,C.dim,12,'center');
 }});

   if(k===2){ctx.strokeStyle=cur?C.red:C.grey;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ap.x,ym-22);for(let z=0;z<8;z++)ctx.lineTo(ap.x+(z%2?9:-9),ym-18+z*5);ctx.lineTo(ap.x,ym+22);ctx.stroke();if(cur)U.glow(ctx,ap.x,ym,34,C.red);}
   U.text(ctx,ap.name,ap.x,ym+38,C.white,12,'center');U.text(ctx,ap.A+' A',ap.x,ym+54,cur?C.yellow:C.dim,12,'center','700');
   if(cur){const path=[[ap.x-6,yT+4],[ap.x-6,yB-4]];dots(ctx,path,t,Math.max(2,Math.round(ap.A/2)+2),C.yellow,2.5);}
   ctx.restore();});
  if(i>=1)U.text(ctx,'並聯：每個電器都是 110 V',w*0.55,h*0.1,C.teal,13,'center','700');
  if(cur){dots(ctx,[[fx+20,yT-5],[w*0.7,yT-5]],t,10,C.yellow,3);U.text(ctx,'總電流 = 0.5 + 0.5 + 10 = 11 A',w*0.55,yB+16,C.yellow,13,'center','700');}
  // 短路
  if(i>=4){const q=i===4?p:1;const sx=w*0.88;U.line(ctx,sx,yT,sx,yT+(yB-yT)*Math.min(1,q/0.5),C.red,3);U.text(ctx,'短路！',sx,h*0.51,C.red,13,'center','700');if(q>0.4&&q<0.7){for(let k=0;k<8;k++){const a=k/8*Math.PI*2+t*7;U.line(ctx,sx,yT+(yB-yT)*0.5,sx+Math.cos(a)*18,yT+(yB-yT)*0.5+Math.sin(a)*18,C.yellow,1.5);}U.text(ctx,'電流暴增，電線發燙',sx,yB+16,C.red,12,'center');}}
  if(i>=5){U.rect(ctx,w*0.12,h*0.9,w*0.76,h*0.09,'#0b0f19ee',C.yellow,1);U.text(ctx,'並聯供電 110 V｜總電流會相加｜保險絲、無熔絲開關防止過載與短路',w/2,h*0.945,C.yellow,12,'center','700');}
 }});

Engine.anim('9b_energyflow',{title:'發電的能量轉換鏈',note:'各種發電方式的能量一路怎麼變，最後都是電能；每一步都會漏掉一些熱。',
 steps:[{caption:'火力發電：燃料的化學能 → 燒開水的熱能 → 蒸汽推動渦輪的動能 → 發電機變成電能',dur:3.5},{caption:'水力發電：高處水的位能 → 水流的動能 → 電能',dur:3},{caption:'風力發電：風的動能 → 電能',dur:2.5},{caption:'太陽能發電：光能 → 電能（太陽能板直接轉換，沒有發電機）',dur:3},{caption:'每一次轉換都有一部分變成散失到環境的熱，無法再拿來利用',dur:3.5},{caption:'能量守恆：總量不變，可利用的能量卻越來越少，所以要節約能源',dur:3}],
 draw:(ctx,w,h,i,p,t)=>{
  const rows=[
   {name:'火力',col:C.red,items:[['化學能','燃料'],['熱能','燒水'],['動能','渦輪'],['電能','發電機']]},
   {name:'水力',col:C.blue,items:[['位能','高處的水'],['動能','水流'],['電能','發電機']]},
   {name:'風力',col:C.teal,items:[['動能','風'],['電能','發電機']]},
   {name:'太陽能',col:C.gold,items:[['光能','陽光'],['電能','太陽能板']]}];
  const bw=w*0.15,bh=h*0.12,x0=w*0.2,x1=w*0.92;
  rows.forEach((row,k)=>{
   const q=i<k?0:i===k?p:1;if(q<=0)return;
   const y=h*(0.16+k*0.19);ctx.save();ctx.globalAlpha=q;
   U.text(ctx,row.name,w*0.09,y,row.col,14,'center','700');
   const n=row.items.length;const xs=row.items.map((_,m)=>n===1?x1:U.lerp(x0+bw/2,x1-bw/2,m/(n-1)));
   row.items.forEach((it,m)=>{const x=xs[m];const isE=it[0]==='電能';U.rect(ctx,x-bw/2,y-bh/2,bw,bh,isE?A(C.yellow,0.15):'#ffffff0c',isE?C.yellow:row.col,1.5);U.text(ctx,it[0],x,y-7,isE?C.yellow:C.white,13,'center','700');U.text(ctx,it[1],x,y+9,C.dim,10,'center');
    if(m<n-1){const nx=xs[m+1];U.arrow(ctx,x+bw/2+3,y,nx-bw/2-3,y,row.col,2,8);
     if(i>=4){const mx=(x+bw/2+nx-bw/2)/2;ctx.save();ctx.strokeStyle=C.orange;ctx.lineWidth=1.5;ctx.beginPath();for(let z=0;z<=8;z++){const yy=y+6+z*2.2,xx=mx+Math.sin(z*1.2+t*5)*4;z?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();ctx.restore();U.text(ctx,'熱',mx,y+30,C.orange,10,'center');}}});
   ctx.restore();});
  if(i>=4)U.text(ctx,'橘色波浪 = 散失的熱（無法利用）',w*0.55,h*0.05,C.orange,12,'center');
  if(i>=5){U.rect(ctx,w*0.1,h*0.9,w*0.8,h*0.09,'#0b0f19ee',C.yellow,1);U.text(ctx,'能量守恆：總量不變，但每次轉換都有一部分變成無法利用的熱',w/2,h*0.945,C.yellow,12,'center','700');}
 }});
})();

/* ---- app.js ---- */
/* ===== page builder ===== */
(function(){
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const nav=document.querySelector('nav.side'),main=document.querySelector('main'),tabs=document.querySelector('.booktabs');
  const pending=[];
  CURRICULUM.forEach((bk,bi)=>{
    const bkEl=document.createElement('section');bkEl.className='book';bkEl.id='bk-'+bk.id;
    bkEl.innerHTML=`<h2>${esc(bk.title)}</h2><div class="bnote">${esc(bk.note||'')}</div>`;
    main.appendChild(bkEl);
    const t=document.createElement('a');t.href='#bk-'+bk.id;t.textContent=bk.short||bk.title;tabs.appendChild(t);
    const nb=document.createElement('div');nb.className='bk';nb.textContent=bk.title;nav.appendChild(nb);
    bk.chapters.forEach((ch,ci)=>{
      const cid=`c-${bk.id}-${ci}`;
      const chEl=document.createElement('div');chEl.className='chapter';chEl.id=cid;
      chEl.innerHTML=`<h3><span class="num">${ch.num||('第'+ci+'章')}</span>${esc(ch.title)}</h3>`;
      bkEl.appendChild(chEl);
      const na=document.createElement('a');na.className='ch';na.href='#'+cid;na.textContent=(ch.num||'')+' '+ch.title;nav.appendChild(na);
      ch.sections.forEach((sec,si)=>{
        const sid=`${cid}-${si}`;
        const secEl=document.createElement('div');secEl.className='section';secEl.id=sid;
        secEl.innerHTML=`<h4>${esc(sec.title)}</h4>`;chEl.appendChild(secEl);
        const ns=document.createElement('a');ns.className='sec';ns.href='#'+sid;ns.textContent=sec.title;nav.appendChild(ns);
        sec.points.forEach((pt,pi)=>{
          const p=document.createElement('article');p.className='point';
          p.innerHTML=`<h5><span class="idx">重點 ${pi+1}</span>${esc(pt.title)}</h5>${pt.key?`<p class="key">${esc(pt.key)}</p>`:''}<div class="mods"></div>`;
          secEl.appendChild(p);
          const mods=p.querySelector('.mods');
          (pt.mods||[]).forEach(id=>{const host=document.createElement('div');host.className='modhost';host.dataset.mod=id;mods.appendChild(host);pending.push(host);});
          if(pt.think){const d=document.createElement('details');d.className='think';d.innerHTML=`<summary>想一想</summary><div class="q">${esc(pt.think.q)}</div><div class="a">答：${esc(pt.think.a)}</div>`;p.appendChild(d);}
        });
      });
    });
  });
  // lazy mount
  const mio=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const host=e.target;mio.unobserve(host);if(host.querySelector('.mod'))return;const inst=Engine.mount(host.dataset.mod,host);if(inst)Engine.watch(inst);});},{rootMargin:'500px'});
  pending.forEach(h=>mio.observe(h));
  // nav highlighting
  const chEls=[...document.querySelectorAll('.chapter')];
  const hio=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav.side .ch').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));const bid=e.target.closest('.book').id;tabs.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+bid));}});},{rootMargin:'-40% 0px -55% 0px'});
  chEls.forEach(c=>hio.observe(c));
  // mobile menu
  const mb=document.querySelector('.menubtn');mb.onclick=()=>nav.classList.toggle('open');
  nav.addEventListener('click',e=>{if(e.target.tagName==='A')nav.classList.remove('open');});
  // count
  const n=pending.length;const cnt=document.getElementById('modcount');if(cnt)cnt.textContent=n;
})();

</script>
